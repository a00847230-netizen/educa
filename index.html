<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6B2FD6">
<meta name="description" content="Educa, la app para aprender inglés práctico, flexible y accesible.">
<title>Educa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<script src="config.js"></script>
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("educa-theme")||"light");}catch(e){document.documentElement.setAttribute("data-theme","light");}</script>
<style>
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}

/* Layout: phone-first app shell; sign-up gate first, then sticky top bar, six views and a bottom tab bar */
:root{
  --bg:#FAF7FF; --surface:#FFFFFF; --ink:#231536; --muted:#6B5F7E; --line:#E9E1F5;
  --brand:#6B2FD6; --brand-ink:#FFFFFF; --brand-soft:#EEE6FD; --sun:#F2A516; --sun-soft:#FDF0D3;
  --good:#1E8A4C; --good-soft:#E2F4E8; --bad:#C2412D; --bad-soft:#FBE6E2;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#1C1430; --surface:#271C3E; --ink:#F1ECFA; --muted:#B5A8CC; --line:#3B2E56;
  --brand:#B79CFF; --brand-ink:#1A0B33; --brand-soft:#352753; --sun:#F5B53A; --sun-soft:#3A2E12;
  --good:#4CC67F; --good-soft:#123321; --bad:#F07B66; --bad-soft:#3A1C16; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.logo{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.02em;color:var(--brand)}
.logo span{color:var(--sun)}
.stats{display:flex;gap:8px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.avatar{width:34px;height:34px;border-radius:50%;border:0;background:var(--brand);color:var(--brand-ink);font-weight:800;font-family:var(--display)}
main{flex:1;padding-block:20px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
main.gate{padding-block:28px 40px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:28px;line-height:1.15;font-weight:800}
h2{font-size:21px;font-weight:800}
h3{font-size:17px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{font:inherit;cursor:pointer}
.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:700;background:var(--brand);color:var(--brand-ink);border-bottom:3px solid rgba(0,0,0,.2)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--brand);border:2px solid var(--line)}
.btn.soft{background:var(--brand-soft);color:var(--ink);border-bottom-color:transparent}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.hero{background:var(--brand);color:var(--brand-ink);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:14px}
.hero .eyebrow{color:inherit;opacity:.8}
.hero .btn{background:var(--sun);color:#2A1C00}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--sun);border-radius:99px;transition:width .4s}
.hero .bar{background:rgba(255,255,255,.25)}
.units{display:flex;flex-direction:column;gap:10px}
.unit{display:grid;grid-template-columns:48px 1fr auto;gap:14px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;color:var(--ink);width:100%}
.unit .badge{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:18px;background:var(--brand-soft);color:var(--brand)}
.unit.done .badge{background:var(--good-soft);color:var(--good)}
.unit[disabled]{opacity:.5;cursor:not-allowed}
.unit>div{min-width:0}
.pill{font-size:12px;font-weight:700;padding:4px 9px;border-radius:99px;background:var(--bg);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.sk{background:var(--brand-soft);color:var(--brand)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tab{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:8px 14px;font-weight:700;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.tab[disabled]{opacity:.5}
.skills{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.skill{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
.skill .bar{height:7px}
.skill .bar>i{background:var(--brand)}
/* learn screen */
.learn h2{color:var(--brand)}
.rule{padding:12px 14px;border-radius:12px;background:var(--brand-soft);font-weight:500}
.ex-line{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.ex-line:first-child{border-top:0}
.ex-line>div{min-width:0}
.ex-line b{font-family:var(--display);font-size:17px;font-weight:600}
.tip{padding:12px 14px;border-radius:12px;background:var(--sun-soft);font-size:15px}
.passage{font-size:17px;line-height:1.65;padding:16px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
/* player */
.player{display:flex;flex-direction:column;gap:18px}
.prompt{font-family:var(--display);font-size:21px;font-weight:600;line-height:1.3}
.opts{display:grid;gap:10px}
.opt{text-align:left;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.feedback{border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.feedback b{font-weight:700}
.feedback.ok{background:var(--good-soft);color:var(--good)}
.feedback.no{background:var(--bad-soft);color:var(--bad)}
.feedback .why{color:var(--ink);font-weight:500}
.speak{border:0;background:var(--sun-soft);color:var(--ink);border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px}
input[type=text],input[type=email],textarea,select{font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:13px 14px;width:100%}
textarea{min-height:180px;resize:vertical;line-height:1.55}
input:focus,textarea:focus,select:focus{border-color:var(--brand);outline:none}
label.field{display:flex;flex-direction:column;gap:6px}
.words{display:flex;flex-wrap:wrap;gap:8px}
.word{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 12px;font-weight:600}
.word[aria-pressed="true"]{opacity:.3}
.answer-line{min-height:52px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding-bottom:8px}
.mic{width:96px;height:96px;border-radius:50%;border:0;background:var(--brand);color:var(--brand-ink);font-size:36px;align-self:center;box-shadow:0 0 0 0 var(--brand-soft);transition:box-shadow .3s}
.mic.on{box-shadow:0 0 0 14px var(--brand-soft);background:var(--bad)}
.heard{min-height:56px;padding:12px 14px;border-radius:12px;border:2px dashed var(--line);font-size:17px}
.heard .miss{color:var(--bad);text-decoration:underline}
.heard .hit{color:var(--good)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--brand)}
.ai{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:14px;border:2px solid var(--brand-soft)}
.fix{padding:10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px;font-size:15px}
.fix s{color:var(--bad)}
.fix ins{color:var(--good);text-decoration:none;font-weight:700}
.count{font-size:13px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.chat{display:flex;flex-direction:column;gap:10px}
.bubble{max-width:86%;padding:12px 14px;border-radius:16px;display:flex;flex-direction:column;gap:8px;font-size:16px}
.bubble p{margin:0}
.bubble.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.bubble.me{align-self:flex-end;background:var(--brand);color:var(--brand-ink);border-bottom-right-radius:4px}
.bubble.typing{padding:16px 22px}
.fixnote{align-self:flex-end;max-width:86%;font-size:14px;padding:8px 12px;border-radius:12px;background:var(--sun-soft)}
.composer{position:sticky;bottom:calc(66px + env(safe-area-inset-bottom,0px));background:var(--bg);padding-block:10px;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);z-index:4}
/* phrases, careers, sheets */
.phrase{display:flex;flex-direction:column;gap:6px;padding:14px 0;border-top:1px solid var(--line)}
.phrase:first-child{border-top:0}
.phrase .en{font-family:var(--display);font-size:19px;font-weight:600}
.phrase .tag{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.vocab .item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.vocab .item:first-child{border-top:0}
.vocab .item>div{min-width:0}
.opp{display:flex;flex-direction:column;gap:8px}
.opp a{color:var(--brand);font-weight:700}
.sheet{background:#FFFFFF;color:#1B1B1B;border-radius:6px;padding:22px;border:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.sheet h3{color:#1B1B1B}
.sheet .line{border-bottom:1.5px solid #A79FB5;height:26px}
.sheet ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:12px}
.note{font-size:13px;color:var(--muted)}
.notice{padding:12px 14px;border-radius:12px;background:var(--sun-soft);font-size:14px}
.err{color:var(--bad);font-size:14px;font-weight:600}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:5px;border-radius:9px;background:var(--line)}
.steps i.on{background:var(--brand)}
.choice{display:grid;gap:10px}
.choice button{text-align:left;padding:16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);display:flex;flex-direction:column;gap:4px}
.choice button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.choice button b{font-family:var(--display);font-size:17px}
.loading{display:grid;place-items:center;min-height:60vh;text-align:center;gap:12px}
.dot{width:14px;height:14px;border-radius:50%;background:var(--brand);animation:pulse 1s infinite alternate}
@keyframes pulse{to{transform:scale(1.6);opacity:.4}}
nav.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabbar .inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav.tabbar button{background:none;border:0;color:var(--muted);padding:10px 2px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;line-height:1.15;text-align:center;font-weight:700}
nav.tabbar button svg{width:24px;height:24px}
nav.tabbar button[aria-current="page"]{color:var(--brand)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:20;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.app.wide{max-width:980px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.grid2>*{min-width:0}
.hbar{display:grid;grid-template-columns:minmax(70px,38%) 1fr 40px;gap:10px;align-items:center;font-size:14px}
.hbar>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar b{text-align:right;font-variant-numeric:tabular-nums}
input[type=password]{font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:13px 14px;width:100%}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:50%;width:36px;height:36px;font-size:17px;display:grid;place-items:center;padding:0;cursor:pointer}
.hero{background:linear-gradient(135deg,#6B2FD6 0%,#8B4FE8 60%,#B05FE0 100%);color:#fff;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.09);right:-50px;top:-60px;pointer-events:none}
.hero::before{content:"";position:absolute;width:110px;height:110px;border-radius:50%;background:rgba(242,165,22,.22);right:30px;bottom:-50px;pointer-events:none}
.hero>*{position:relative;z-index:1}
.greet{display:flex;align-items:flex-end;gap:6px}
.greet .mascot{flex:none}
.speech{background:var(--surface);border:2px solid var(--line);border-radius:18px 18px 18px 4px;padding:10px 14px;font-weight:600;font-size:15px;line-height:1.35;margin-bottom:22px;max-width:280px;color:var(--ink)}
.streakcard h2{margin-top:2px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
.wd i{width:34px;height:34px;border-radius:50%;background:var(--bg);border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:16px}
.wd.on i{background:var(--sun-soft);border-color:var(--sun)}
.wd.today span{color:var(--brand)}
.unit .badge{overflow:hidden}
.unit .badge .illo{width:48px;height:48px}
.badge.b3{background:var(--sun-soft);color:#B57400}
.units .unit:nth-child(3n+2) .badge{background:#FFE3EF;color:#C2336D}
.units .unit:nth-child(3n) .badge{background:#E1F1FF;color:#2B65B8}
:root[data-theme="dark"] .units .unit:nth-child(3n+2) .badge{background:#4A2238;color:#FFB3CF}
:root[data-theme="dark"] .units .unit:nth-child(3n) .badge{background:#1F3350;color:#A9CCFF}
.pagehead{position:relative;padding-right:76px;min-height:64px}
.ph-illo{position:absolute;right:0;top:0}
.ph-illo .illo{filter:drop-shadow(0 6px 12px rgba(107,47,214,.25));transform:rotate(6deg)}
.feedback{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:10px}
.feedback>div{display:flex;flex-direction:column;gap:4px}
.feedback .mascot{width:52px;height:auto}
.lock{flex-direction:row;align-items:center;gap:14px}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--ink);padding:8px 12px;font-weight:700;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.selfcheck{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.selfcheck button{padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700}
.selfcheck button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall 2.2s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.result-ajo{display:flex;justify-content:center}
.lp-top{display:flex;justify-content:space-between;align-items:center}
.lp-hero{background:linear-gradient(140deg,#6B2FD6 0%,#9150EC 55%,#D46AB8 100%);color:#fff;border-radius:24px;padding:24px 22px 0;display:grid;grid-template-columns:1fr;gap:6px;overflow:hidden;position:relative}
.lp-hero::after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08);left:-60px;bottom:-90px}
.lp-hero>*{position:relative;z-index:1}
.lp-copy{display:flex;flex-direction:column;gap:12px}
.lp-copy .eyebrow{color:#fff;opacity:.85}
.lp-copy h1{font-size:30px;line-height:1.12}
.lp-copy .btn{background:#F2A516;color:#2A1C00}
.lp-copy .lp-ghost{background:rgba(255,255,255,.14);color:#fff;border:2px solid rgba(255,255,255,.4)}
.lp-ajo{display:flex;align-items:flex-end;justify-content:flex-end;gap:4px;margin-top:4px}
.lp-ajo .speech{margin-bottom:60px;color:#231536;background:#fff;border-color:#fff}
.lp-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lp-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.lp-card p{font-size:14px;line-height:1.4}
.lp-steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px}
.lp-steps li{padding-left:4px}.lp-steps li b{display:block}
.lp-levels .row{gap:6px}
.lp-plans{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lp-plans .plus{border:2px solid var(--brand);background:var(--brand-soft)}
.lp-plans h2 small{font-size:13px;font-weight:600;color:var(--muted)}
.lp-final{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px}
@media (min-width:520px){.lp-hero{grid-template-columns:1.25fr .9fr}.lp-ajo{flex-direction:column;align-items:center}.lp-ajo .speech{margin-bottom:0}}
@media (max-width:380px){.lp-grid,.lp-plans{grid-template-columns:1fr}}
</style>

</head>
<body>
<div class="app">
  <header class="top" id="top" hidden>
    <div class="logo" aria-label="Educa">educa<span>.</span></div>
    <div class="stats">
      <span class="chip" title="Días seguidos">🔥 <b id="streak">0</b></span>
      <span class="chip" title="Puntos de experiencia">⭐ <b id="xp">0</b></span>
      <button class="iconbtn themebtn" aria-label="Cambiar tema">🌙</button>
      <button class="avatar" id="me" data-go="cuenta" aria-label="Mi cuenta">E</button>
    </div>
  </header>
  <main id="view"><div class="loading"><div class="dot"></div><p class="muted">Cargando Educa…</p></div></main>
  <nav class="tabbar" id="nav" aria-label="Secciones" hidden>
    <div class="inner">
      <button data-go="inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</button>
      <button data-go="tutor"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/><circle cx="12" cy="12" r="3"/></svg>Tutor IA</button>

<script>

   que explican por qué cada respuesta es correcta.

const LEVELS=[
  {id:"A1",name:"Principiante",goal:"Presentarte y manejar situaciones muy básicas",hours:"90 a 100 h"},
  {id:"A2",name:"Elemental",goal:"Conversar de temas cotidianos, del pasado y de tus planes",hours:"100 h"},
  {id:"B1",name:"Intermedio",goal:"Desenvolverte en viajes, trabajo y estudios, y dar tu opinión",hours:"170 h"},
  {id:"B2",name:"Intermedio alto",goal:"Comunicarte con fluidez y entender textos complejos",hours:"200 h"},
  {id:"C1",name:"Avanzado",goal:"Usar el idioma con flexibilidad en contextos académicos y profesionales",hours:"200 h"},
  {id:"C2",name:"Experto",goal:"Dominio cercano al de un hablante nativo culto",hours:"250 h"}
];
const SKILLS=[
  {id:"grammar",name:"Grammar",es:"Gramática"},
  {id:"vocabulary",name:"Vocabulary",es:"Vocabulario"},
  {id:"listening",name:"Listening",es:"Comprensión auditiva"},
  {id:"reading",name:"Reading",es:"Lectura"},
  {id:"writing",name:"Writing",es:"Escritura"},
  {id:"speaking",name:"Speaking",es:"Expresión oral"}
];

const LESSONS=[
/* ---------------- A1 ---------------- */
{id:"a1-g1",level:"A1",skill:"grammar",title:"Verb to be",desc:"Decir quién eres, cómo estás y de dónde eres",
 learn:{text:"«To be» significa ser o estar. Cambia según la persona.",
  rules:["I am · you are · he/she/it is · we/they are","Negativo con not. She is not (isn't) here.","Pregunta invirtiendo el orden. Are you a student?"],
  examples:[["I'm from Monterrey.","Soy de Monterrey."],["She isn't tired.","Ella no está cansada."],["Are they your friends?","¿Son tus amigos?"]],
  tip:"En español a veces omitimos el sujeto («soy estudiante»). En inglés siempre va. Di I am a student, nunca «am a student»."},
 ex:[
  {t:"mc",q:"Completa «They ___ my cousins.»",o:["is","am","are"],a:2,why:"Con they se usa are."},
  {t:"fill",q:"Escribe la palabra que falta. «I ___ 20 years old.»",a:["am","'m"],why:"La edad en inglés se dice con to be. I am 20 years old."},
  {t:"mc",q:"¿Cuál es la pregunta correcta?",o:["You are a student?","Are you a student?","Do you are a student?"],a:1,why:"Para preguntar se pone el verbo to be antes del sujeto."},
  {t:"order",q:"Ordena «Él no es doctor»",w:["He","is","not","a","doctor"],why:"Not va después de is. Fíjate en el artículo a antes de la profesión."},
  {t:"write",q:"Escribe en inglés «Tengo hambre»",a:["i am hungry"],why:"Hambre, sed, frío y calor se dicen con to be. I'm hungry."}
 ]},
{id:"a1-g2",level:"A1",skill:"grammar",title:"Presente simple",desc:"Hablar de rutinas y cosas que siempre pasan",
 learn:{text:"El presente simple describe hábitos y hechos. Con he, she e it el verbo lleva -s.",
  rules:["I work · he works · she studies · it goes","Negativo con don't o doesn't + verbo base","Pregunta con do o does. Does she work here?"],
  examples:[["I study every night.","Estudio todas las noches."],["He doesn't drink coffee.","Él no toma café."],["Do you live near here?","¿Vives cerca de aquí?"]],
  tip:"Cuando ya usas doesn't el verbo regresa a su forma base. Di she doesn't work, nunca «she doesn't works»."},
 ex:[
  {t:"mc",q:"Completa «She ___ in a hospital.»",o:["work","works","working"],a:1,why:"Con she el verbo lleva -s. She works."},
  {t:"mc",q:"Completa «___ he speak English?»",o:["Do","Does","Is"],a:1,why:"Con he, she e it la pregunta usa does."},
  {t:"fill",q:"Escribe la forma correcta de study. «My brother ___ medicine.»",a:["studies"],why:"Si el verbo termina en consonante + y, cambia a -ies."},
  {t:"order",q:"Ordena «No trabajo los domingos»",w:["I","don't","work","on","Sundays"],why:"Los días de la semana van con on y mayúscula."},
  {t:"write",q:"Escribe en inglés «¿Dónde vives?»",a:["where do you live"],why:"Palabra de pregunta + do + sujeto + verbo."}
 ]},
{id:"a1-v1",level:"A1",skill:"vocabulary",title:"Familia, números y la hora",desc:"Las palabras que usas todos los días",
 learn:{text:"Aprende estas palabras en grupos. Así se recuerdan mejor.",
  rules:["Familia. mother, father, sister, brother, aunt, uncle, cousin","Números. thirteen (13) y thirty (30) se distinguen por la sílaba fuerte","La hora. It's half past three (3:30). It's a quarter to five (4:45)."],
  examples:[["My aunt is a teacher.","Mi tía es maestra."],["It's ten o'clock.","Son las diez en punto."],["I have two sisters.","Tengo dos hermanas."]],
  tip:"Cousin sirve para primo y prima. Parents significa papás, y relatives significa parientes."},
 ex:[
  {t:"mc",q:"«Mis papás» en inglés es…",o:["My relatives","My parents","My fathers"],a:1,why:"Parents son papá y mamá juntos. Relatives son parientes en general."},
  {t:"listen",q:"Escucha y elige el número",say:"thirteen",o:["13","30","3"],a:0,why:"En thirTEEN la fuerza va al final. En THIRty va al inicio."},
  {t:"mc",q:"¿Cómo se dice 7:30?",o:["It's half past seven","It's half to seven","It's seven and half"],a:0,why:"Half past significa y media."},
  {t:"fill",q:"El hermano de tu papá es tu ___.",a:["uncle"],why:"Uncle es tío y aunt es tía."}
 ]},
{id:"a1-l1",level:"A1",skill:"listening",title:"Mucho gusto",desc:"Entender presentaciones cortas",
 learn:{text:"Escucha cada frase dos veces. La primera para captar la idea, la segunda para los detalles.",
  rules:["Where are you from? pregunta tu origen","What do you do? pregunta tu trabajo","How old are you? pregunta tu edad"],
  examples:[["Nice to meet you.","Mucho gusto."],["What do you do?","¿A qué te dedicas?"],["I'm a nurse.","Soy enfermera."]],
  tip:"What do you do? suena como «wadaya du». Las palabras pequeñas se unen al hablar rápido."},
 ex:[
  {t:"listen",q:"¿Qué te preguntan?",say:"What do you do?",o:["¿Qué haces ahora?","¿A qué te dedicas?","¿Qué quieres?"],a:1,why:"What do you do? pregunta por tu trabajo o actividad."},
  {t:"listen",q:"Elige lo que oíste",say:"I'm from Mexico, but I live in Canada.",o:["Soy de Canadá y vivo en México","Soy de México y vivo en Canadá","Soy de México y vivo en México"],a:1,why:"I'm from indica el origen y I live in indica dónde vive."},
  {t:"listen",q:"¿Cuántos años tiene?",say:"I'm twenty-two years old.",o:["20","22","12"],a:1,why:"Twenty-two es veintidós."},
  {t:"listen",q:"Elige lo que oíste",say:"Nice to meet you too.",o:["Igualmente, mucho gusto","Nos vemos pronto","Gracias por venir"],a:0,why:"Too al final significa también o igualmente."}
 ]},
{id:"a1-s1",level:"A1",skill:"speaking",title:"Preséntate en voz alta",desc:"Practica tu pronunciación con frases básicas",
 learn:{text:"Escucha cada frase, repítela en voz alta y compara. Habla despacio y claro.",
  rules:["El sonido th de three se hace con la lengua entre los dientes","La h de hello se pronuncia como una j suave","En name la a suena «ei»"],
  examples:[["Hello, my name is Ana.","Hola, me llamo Ana."],["I'm from Mexico.","Soy de México."],["I'm a student.","Soy estudiante."]],
  tip:"Graba tu voz. Escucharte ayuda a notar los sonidos que todavía no salen."},
 ex:[
  {t:"speak",q:"Di esta frase en voz alta",say:"Hello, my name is Ana."},
  {t:"speak",q:"Di esta frase en voz alta",say:"I am from Mexico."},
  {t:"speak",q:"Di esta frase en voz alta",say:"I study three days a week."}
 ]},
{id:"a1-w1",level:"A1",skill:"writing",title:"Tu presentación personal",desc:"Escribe un párrafo corto sobre ti",
 learn:{text:"Un buen párrafo de presentación dice quién eres, de dónde eres, a qué te dedicas y qué te gusta.",
  rules:["Usa oraciones cortas con to be y presente simple","Empieza cada oración con mayúscula","Une ideas con and y but"],
  examples:[["My name is Luis and I am 19.","Me llamo Luis y tengo 19."],["I live in Guadalajara.","Vivo en Guadalajara."],["I like music but I don't play an instrument.","Me gusta la música pero no toco un instrumento."]],
  tip:"I siempre va con mayúscula, aunque esté a la mitad de la oración."},
 ex:[
  {t:"essay",q:"Escribe tu presentación en inglés (mínimo 40 palabras). Di tu nombre, edad, ciudad, a qué te dedicas y qué te gusta.",min:40,
   checklist:["Dije mi nombre y mi edad","Dije de dónde soy o dónde vivo","Usé el presente simple para hablar de lo que hago","Revisé que cada oración empieza con mayúscula"],
   model:"Hello! My name is Daniela and I am 21 years old. I am from Saltillo, but I live in Monterrey. I am a nursing student. I study in the morning and I work in a coffee shop in the afternoon. I like music and movies. On weekends I visit my family."}
 ]},
/* ---------------- A2 ---------------- */
{id:"a2-g1",level:"A2",skill:"grammar",title:"Pasado simple",desc:"Contar lo que hiciste",
 learn:{text:"El pasado simple habla de acciones terminadas. Los verbos regulares agregan -ed. Los irregulares cambian.",
  rules:["Regulares. work → worked, study → studied","Irregulares comunes. go → went, have → had, eat → ate, see → saw","Negativo y pregunta con did + verbo base. Did you go? I didn't go."],
  examples:[["I went to the beach last summer.","Fui a la playa el verano pasado."],["She didn't call me.","Ella no me llamó."],["Did you see the game?","¿Viste el partido?"]],
  tip:"Después de did el verbo vuelve a su forma base. Di did you go, nunca «did you went»."},
 ex:[
  {t:"mc",q:"Completa «Yesterday I ___ pizza.»",o:["eat","ate","eated"],a:1,why:"Eat es irregular. Su pasado es ate."},
  {t:"mc",q:"¿Cuál es correcta?",o:["Did you went to class?","Did you go to class?","You did go to class?"],a:1,why:"Con did el verbo queda en forma base."},
  {t:"fill",q:"Pasado de study. «We ___ for the exam.»",a:["studied"],why:"Consonante + y cambia a -ied."},
  {t:"order",q:"Ordena «No vi a mi amigo ayer»",w:["I","didn't","see","my","friend","yesterday"],why:"Didn't + verbo base."},
  {t:"write",q:"Escribe en inglés «Tuve un buen día»",a:["i had a good day"],why:"Have es irregular. Su pasado es had."}
 ]},
{id:"a2-g2",level:"A2",skill:"grammar",title:"Comparativos y superlativos",desc:"Comparar personas, lugares y cosas",
 learn:{text:"Para comparar dos cosas usa -er o more. Para decir que algo es el máximo usa the -est o the most.",
  rules:["Adjetivos cortos. cheap → cheaper → the cheapest","Adjetivos largos. expensive → more expensive → the most expensive","Irregulares. good → better → the best · bad → worse → the worst"],
  examples:[["Monterrey is hotter than Toluca.","Monterrey es más caluroso que Toluca."],["This is the best tacos place.","Este es el mejor lugar de tacos."],["English is easier than I thought.","El inglés es más fácil de lo que pensé."]],
  tip:"Después de un comparativo va than, no that. Bigger than me."},
 ex:[
  {t:"mc",q:"Completa «My phone is ___ than yours.»",o:["more cheap","cheaper","cheapest"],a:1,why:"Cheap es corto, así que agrega -er."},
  {t:"mc",q:"Completa «It's the ___ movie of the year.»",o:["most good","better","best"],a:2,why:"Good es irregular. El superlativo es the best."},
  {t:"fill",q:"«This course is more useful ___ the other one.»",a:["than"],why:"Los comparativos siempre van con than."},
  {t:"write",q:"Escribe «Es el día más importante»",a:["it is the most important day"],why:"Important es largo. Se usa the most."}
 ]},
{id:"a2-g3",level:"A2",skill:"grammar",title:"Have to, must y should",desc:"Hablar de obligaciones y dar consejos",
 learn:{text:"Have to y must expresan obligación. Should da un consejo.",
  rules:["I have to work on Saturday. (obligación externa)","You must wear a helmet. (regla o algo muy importante)","You should drink more water. (consejo)"],
  examples:[["I have to finish my homework.","Tengo que terminar mi tarea."],["You should rest.","Deberías descansar."],["Students must arrive on time.","Los alumnos deben llegar a tiempo."]],
  tip:"Don't have to significa que no es necesario. Mustn't significa que está prohibido."},
 ex:[
  {t:"mc",q:"Tu amigo está enfermo. ¿Qué le dices?",o:["You should see a doctor","You mustn't see a doctor","You have see a doctor"],a:0,why:"Should sirve para aconsejar."},
  {t:"mc",q:"«No tienes que venir mañana» es…",o:["You mustn't come tomorrow","You don't have to come tomorrow","You shouldn't come tomorrow"],a:1,why:"Don't have to indica que no es necesario."},
  {t:"fill",q:"«She ___ to wear a uniform at work.»",a:["has"],why:"Con she se usa has to."},
  {t:"order",q:"Ordena «Deberías estudiar más»",w:["You","should","study","more"],why:"Should + verbo base."}
 ]},
{id:"a2-v1",level:"A2",skill:"vocabulary",title:"Restaurantes y compras",desc:"Pedir comida, pagar y preguntar precios",
 learn:{text:"Estas frases te sirven en cualquier restaurante o tienda.",
  rules:["Pedir. Can I have…? I'd like…","Pagar. Can I pay by card? Can I get the check, please?","Precios. How much is it? Is there a discount?"],
  examples:[["I'd like a coffee, please.","Quisiera un café, por favor."],["Can I get the check?","¿Me trae la cuenta?"],["Do you have this in medium?","¿Tiene esto en mediana?"]],
  tip:"I'd like es más amable que I want."},
 ex:[
  {t:"mc",q:"Para pedir la cuenta dices…",o:["Give me the account","Can I get the check, please?","I want the bill now"],a:1,why:"Check (o bill en Reino Unido) es la cuenta. Can I get… es amable."},
  {t:"mc",q:"«¿Lo tiene en otro color?»",o:["Do you have it in another color?","Have you other color?","Is other color?"],a:0,why:"Do you have it in…? sirve para tallas y colores."},
  {t:"fill",q:"«I'd ___ a table for two, please.»",a:["like"],why:"I'd like = quisiera."},
  {t:"listen",q:"¿Qué dijo?",say:"Can I pay by card?",o:["¿Puedo pagar con tarjeta?","¿Puedo pagar en efectivo?","¿Aceptan transferencia?"],a:0,why:"By card es con tarjeta. In cash es en efectivo."}
 ]},
{id:"a2-r1",level:"A2",skill:"reading",title:"Un correo de una amiga",desc:"Leer un mensaje personal y entender los detalles",
 learn:{text:"Lee el correo completo una vez. Después responde las preguntas regresando al texto.",
  passage:"Hi Carla,\n\nHow are you? I'm in Toronto now. I started my new job last Monday. I work at a hotel near the lake. The work is hard but my coworkers are very friendly. It's colder here than in Mexico, so I bought a big jacket yesterday. Next month I'm going to visit Niagara Falls with my sister. Write soon!\n\nLove,\nSofía",
  rules:["Busca palabras de tiempo. last Monday, yesterday, next month","Fíjate en conectores. but, so"],
  tip:"No necesitas entender cada palabra. Concéntrate en las que responden la pregunta."},
 ex:[
  {t:"mc",q:"¿Dónde trabaja Sofía?",o:["En un restaurante","En un hotel","En una escuela"],a:1,why:"El texto dice I work at a hotel near the lake."},
  {t:"mc",q:"¿Por qué compró una chamarra?",o:["Porque hace más frío que en México","Porque su hermana se la pidió","Porque estaba en oferta"],a:0,why:"It's colder here than in Mexico, so I bought a big jacket."},
  {t:"mc",q:"¿Qué va a hacer el próximo mes?",o:["Regresar a México","Cambiar de trabajo","Visitar las cataratas del Niágara"],a:2,why:"Next month I'm going to visit Niagara Falls."},
  {t:"mc",q:"¿Cómo son sus compañeros?",o:["Muy amables","Muy serios","No los conoce"],a:0,why:"My coworkers are very friendly."}
 ]},
{id:"a2-s1",level:"A2",skill:"speaking",title:"Pedir direcciones",desc:"Preguntar y entender cómo llegar a un lugar",
 learn:{text:"Practica preguntas completas y amables. Repite hasta que suenen naturales.",
  rules:["Excuse me abre la conversación con un desconocido","Turn left / turn right / go straight","It's next to… / It's across from…"],
  examples:[["Excuse me, where is the station?","Disculpe, ¿dónde está la estación?"],["Go straight and turn left.","Siga derecho y dé vuelta a la izquierda."]],
  tip:"En straight la «ai» suena como «ei»."},
 ex:[
  {t:"speak",q:"Di esta frase en voz alta",say:"Excuse me, where is the train station?"},
  {t:"speak",q:"Di esta frase en voz alta",say:"Go straight and turn left at the corner."},
  {t:"speak",q:"Di esta frase en voz alta",say:"Is it far from here?"}
 ]},
{id:"a2-w1",level:"A2",skill:"writing",title:"Correo sobre tu fin de semana",desc:"Contar una experiencia en pasado",
 learn:{text:"Un correo informal tiene saludo, cuerpo y despedida. El cuerpo cuenta qué pasó en orden.",
  rules:["Saludo. Hi Mario,","Usa pasado simple y conectores. first, then, after that","Despedida. See you soon, / Take care,"],
  examples:[["First, I went to the market.","Primero fui al mercado."],["Then we watched a movie.","Luego vimos una película."]],
  tip:"Varía los conectores para que tu texto fluya."},
 ex:[
  {t:"essay",q:"Escribe un correo a un amigo contando tu fin de semana (mínimo 60 palabras).",min:60,
   checklist:["Tiene saludo y despedida","Usé el pasado simple","Usé al menos dos conectores (first, then, after that, because, so)","Conté al menos tres cosas que hice"],
   model:"Hi Mario,\n\nHow was your weekend? Mine was great. On Saturday morning I went to the gym. Then I had lunch with my family because it was my mom's birthday. We ate enchiladas and a chocolate cake. On Sunday I stayed at home and studied for my English exam. In the evening I watched a movie with my sister.\n\nTake care,\nAna"}
 ]},
/* ---------------- B1 ---------------- */
{id:"b1-g1",level:"B1",skill:"grammar",title:"Presente perfecto",desc:"Experiencias y acciones que siguen hasta hoy",
 learn:{text:"El presente perfecto se forma con have o has + participio. Conecta el pasado con el presente.",
  rules:["Experiencias. Have you ever been to Canada?","Desde hasta hoy. I have lived here for two years / since 2024.","Pasado simple cuando dices cuándo. I went there in 2023."],
  examples:[["I've never eaten sushi.","Nunca he comido sushi."],["She has worked here since May.","Ella trabaja aquí desde mayo."],["Have you finished yet?","¿Ya terminaste?"]],
  tip:"«Vivo aquí desde hace 3 años» se dice I have lived here for 3 years. No uses el presente simple."},
 ex:[
  {t:"mc",q:"«Trabajo aquí desde hace dos años»",o:["I work here for two years","I have worked here for two years","I worked here since two years"],a:1,why:"Una acción que empezó en el pasado y sigue hoy usa presente perfecto + for."},
  {t:"mc",q:"Completa «I ___ to Cancún in 2022.»",o:["have gone","went","have been"],a:1,why:"Cuando dices el momento exacto (in 2022) se usa pasado simple."},
  {t:"fill",q:"«She has lived in Monterrey ___ 2020.»",a:["since"],why:"Since va con un punto de inicio. For va con una duración."},
  {t:"order",q:"Ordena «¿Alguna vez has viajado en avión?»",w:["Have","you","ever","traveled","by","plane"],why:"Have + sujeto + ever + participio."},
  {t:"write",q:"Escribe «Todavía no he terminado»",a:["i have not finished yet","i haven't finished yet"],why:"Yet va al final en negativos y preguntas."}
 ]},
{id:"b1-g2",level:"B1",skill:"grammar",title:"Condicionales 1 y 2",desc:"Hablar de posibilidades reales e imaginarias",
 learn:{text:"El primer condicional habla de algo probable. El segundo habla de algo imaginario o poco probable.",
  rules:["Primero. If + presente, will + verbo. If it rains, I will stay home.","Segundo. If + pasado, would + verbo. If I had money, I would travel.","En el segundo condicional se usa were con todas las personas. If I were you…"],
  examples:[["If you study, you will pass.","Si estudias, vas a pasar."],["If I lived in London, I would speak better English.","Si viviera en Londres, hablaría mejor inglés."]],
  tip:"Nunca pongas will después de if. Di if it rains, nunca «if it will rain»."},
 ex:[
  {t:"mc",q:"Completa «If I ___ you, I would accept the job.»",o:["am","were","will be"],a:1,why:"If I were you es la forma correcta para dar consejos."},
  {t:"mc",q:"Completa «If she calls, I ___ tell her.»",o:["will","would","am"],a:0,why:"Es una situación probable. Primer condicional con will."},
  {t:"fill",q:"«If I won the lottery, I ___ buy a house.»",a:["would","'d"],why:"Situación imaginaria. Segundo condicional con would."},
  {t:"write",q:"Escribe «Si tengo tiempo, te llamo»",a:["if i have time, i will call you","if i have time i will call you","if i have time, i'll call you"],why:"Primer condicional. If + presente, will + verbo."}
 ]},
{id:"b1-g3",level:"B1",skill:"grammar",title:"Voz pasiva",desc:"Hablar de lo que se hace sin decir quién",
 learn:{text:"La voz pasiva se forma con to be + participio. Pone el foco en lo que pasa.",
  rules:["Presente. English is spoken in many countries.","Pasado. The hospital was built in 1990.","Quién lo hizo va con by. It was written by a student."],
  examples:[["Breakfast is served at 8.","El desayuno se sirve a las 8."],["My phone was stolen.","Me robaron el celular."]],
  tip:"Muchas frases con «se» en español se traducen con pasiva. Se habla inglés = English is spoken."},
 ex:[
  {t:"mc",q:"«Se habla español aquí»",o:["Spanish speaks here","Spanish is spoken here","Here speaks Spanish"],a:1,why:"Se + verbo suele traducirse con to be + participio."},
  {t:"mc",q:"Completa «The emails ___ yesterday.»",o:["were sent","sent","are send"],a:0,why:"Pasado + plural. Were + participio."},
  {t:"fill",q:"«This song was written ___ a Mexican artist.»",a:["by"],why:"By indica quién hizo la acción."},
  {t:"write",q:"Escribe «La reunión fue cancelada»",a:["the meeting was cancelled","the meeting was canceled"],why:"Was + participio."}
 ]},
{id:"b1-v1",level:"B1",skill:"vocabulary",title:"Phrasal verbs del día a día",desc:"Verbos con preposición que cambian de significado",
 learn:{text:"Un phrasal verb es un verbo + una partícula. El significado cambia por completo.",
  rules:["look for = buscar · look after = cuidar","give up = rendirse · find out = descubrir","get up = levantarse · turn on/off = prender/apagar"],
  examples:[["I'm looking for a job.","Estoy buscando trabajo."],["Don't give up!","¡No te rindas!"],["I found out the truth.","Descubrí la verdad."]],
  tip:"Apréndelos en frases completas, no sueltos."},
 ex:[
  {t:"mc",q:"«Cuido a mi abuela»",o:["I look for my grandma","I look after my grandma","I look at my grandma"],a:1,why:"Look after significa cuidar."},
  {t:"mc",q:"«She gave up smoking» significa…",o:["Dejó de fumar","Empezó a fumar","Le dio un cigarro"],a:0,why:"Give up significa dejar o rendirse."},
  {t:"fill",q:"«Please turn ___ the lights when you leave.»",a:["off"],why:"Turn off es apagar."},
  {t:"fill",q:"«I need to find ___ what time the class starts.»",a:["out"],why:"Find out es averiguar."}
 ]},
{id:"b1-l1",level:"B1",skill:"listening",title:"Mensajes del trabajo",desc:"Entender audios a velocidad natural",
 learn:{text:"En el trabajo escucharás horarios, cambios y peticiones. Pon atención a números y verbos.",
  rules:["Reschedule = cambiar la fecha","Postpone = posponer","Right away = de inmediato"],
  examples:[["The meeting has been moved to Thursday.","La junta se cambió al jueves."]],
  tip:"Escucha completo antes de elegir. La información clave suele venir al final."},
 ex:[
  {t:"listen",q:"¿Qué pasó con la junta?",say:"The meeting has been moved from Tuesday to Thursday afternoon.",o:["Se canceló","Se cambió al jueves en la tarde","Se cambió al martes en la mañana"],a:1,why:"Moved from Tuesday to Thursday afternoon."},
  {t:"listen",q:"¿Qué te piden?",say:"Could you send me the report before five, please?",o:["Mandar el reporte antes de las 5","Llamar a las 5","Imprimir el reporte"],a:0,why:"Send me the report before five."},
  {t:"listen",q:"¿Cuándo llega el cliente?",say:"The client is running late, he'll be here in about twenty minutes.",o:["En 2 horas","En unos 20 minutos","Ya llegó"],a:1,why:"In about twenty minutes."}
 ]},
{id:"b1-s1",level:"B1",skill:"speaking",title:"Dar tu opinión",desc:"Expresar lo que piensas con frases naturales",
 learn:{text:"Para opinar, empieza con una frase de opinión, da tu idea y una razón.",
  rules:["In my opinion… / I think that… / From my point of view…","Da una razón con because","Para no sonar tajante usa I'm not sure, but…"],
  examples:[["In my opinion, online classes are useful because they're flexible.","En mi opinión, las clases en línea son útiles porque son flexibles."]],
  tip:"La estructura idea + razón + ejemplo te hace sonar claro y seguro."},
 ex:[
  {t:"speak",q:"Di esta frase en voz alta",say:"In my opinion, learning English opens many doors."},
  {t:"speak",q:"Di esta frase en voz alta",say:"I think that remote work is better because it saves time."},
  {t:"speak",q:"Di esta frase en voz alta",say:"I'm not sure, but I believe it depends on the person."}
 ]},
{id:"b1-w1",level:"B1",skill:"writing",title:"Correo formal",desc:"Escribir a una empresa o una escuela",
 learn:{text:"Un correo formal es claro, amable y sin contracciones.",
  rules:["Saludo. Dear Mr. Smith, / Dear Hiring Manager,","Di el motivo en la primera oración. I am writing to…","Cierre. I look forward to hearing from you. Kind regards,"],
  examples:[["I am writing to apply for the position of…","Le escribo para postularme al puesto de…"],["Please find my CV attached.","Adjunto mi CV."]],
  tip:"En formal escribe I am en lugar de I'm, y do not en lugar de don't."},
 ex:[
  {t:"essay",q:"Escribe un correo formal para pedir información sobre un curso o una vacante (mínimo 80 palabras).",min:80,
   checklist:["Usé saludo y cierre formales","Dije el motivo en la primera oración","Hice al menos dos preguntas concretas","No usé contracciones"],
   model:"Dear Admissions Office,\n\nI am writing to request information about your evening English course. I am a university student and I work during the day, so I am looking for a flexible schedule.\n\nCould you please tell me the start date and the cost of the course? I would also like to know if there is a placement test before the first class.\n\nThank you for your time. I look forward to hearing from you.\n\nKind regards,\nMaría López"}
 ]},
/* ---------------- B2 ---------------- */
{id:"b2-g1",level:"B2",skill:"grammar",title:"Tercer condicional y wish",desc:"Hablar de lo que pudo ser diferente",
 learn:{text:"El tercer condicional imagina un pasado diferente. Wish expresa deseos o arrepentimientos.",
  rules:["If + had + participio, would have + participio. If I had studied, I would have passed.","Wish + pasado = deseo sobre el presente. I wish I spoke French.","Wish + had + participio = arrepentimiento. I wish I had called her."],
  examples:[["If we had left earlier, we wouldn't have missed the flight.","Si hubiéramos salido antes, no habríamos perdido el vuelo."],["I wish I had more time.","Ojalá tuviera más tiempo."]],
  tip:"En el tercer condicional no se usa would en la parte del if."},
 ex:[
  {t:"mc",q:"Completa «If I had known, I ___ you.»",o:["would tell","would have told","had told"],a:1,why:"Tercer condicional. Would have + participio."},
  {t:"mc",q:"«Ojalá hubiera estudiado medicina»",o:["I wish I studied medicine","I wish I had studied medicine","I wish I would study medicine"],a:1,why:"Arrepentimiento sobre el pasado. Wish + had + participio."},
  {t:"fill",q:"«If she ___ taken the job, she would have moved to Spain.»",a:["had"],why:"La parte del if lleva had + participio."},
  {t:"write",q:"Escribe «Ojalá viviera cerca de la playa»",a:["i wish i lived near the beach","i wish i lived close to the beach"],why:"Deseo sobre el presente. Wish + pasado."}
 ]},
{id:"b2-g2",level:"B2",skill:"grammar",title:"Modales en pasado",desc:"Deducir, criticar o lamentar algo del pasado",
 learn:{text:"Modal + have + participio habla del pasado.",
  rules:["Should have = debiste (crítica o lamento)","Could have = pudiste (posibilidad que no pasó)","Must have = seguro que (deducción). Can't have = es imposible que"],
  examples:[["You should have told me.","Me lo hubieras dicho."],["He must have forgotten.","Seguro se le olvidó."],["She can't have left already.","No puede ser que ya se haya ido."]],
  tip:"En la conversación rápida should have suena como «shoulda»."},
 ex:[
  {t:"mc",q:"Tu amigo no contesta. Siempre contesta. Concluyes…",o:["He must have lost his phone","He should have lost his phone","He can lose his phone"],a:0,why:"Must have expresa una deducción lógica sobre el pasado."},
  {t:"mc",q:"«Debiste traer chamarra»",o:["You must have brought a jacket","You should have brought a jacket","You could bring a jacket"],a:1,why:"Should have critica algo que no se hizo."},
  {t:"fill",q:"«We ___ have won, but we made too many mistakes.»",a:["could"],why:"Could have indica una posibilidad que no ocurrió."}
 ]},
{id:"b2-v1",level:"B2",skill:"vocabulary",title:"Conectores avanzados",desc:"Unir ideas con precisión",
 learn:{text:"Los conectores dan lógica a tus textos y discursos.",
  rules:["Contraste. although, whereas, however, despite, in spite of","Consecuencia. therefore, as a result, consequently","Adición. moreover, furthermore, in addition"],
  examples:[["Despite the rain, we went out.","A pesar de la lluvia, salimos."],["Although it was expensive, it was worth it.","Aunque era caro, valió la pena."]],
  tip:"Despite va con sustantivo o -ing. Although va con oración completa."},
 ex:[
  {t:"mc",q:"Completa «___ being tired, she finished the project.»",o:["Although","Despite","However"],a:1,why:"Despite va seguido de -ing o sustantivo."},
  {t:"mc",q:"Completa «Prices went up. ___, sales dropped.»",o:["As a result","Although","Whereas"],a:0,why:"Expresa consecuencia."},
  {t:"fill",q:"«___ I studied a lot, I didn't pass.» (Aunque)",a:["although","though","even though"],why:"Although va con una oración completa."},
  {t:"mc",q:"«My sister loves sports, ___ I prefer reading.»",o:["whereas","therefore","moreover"],a:0,why:"Whereas contrasta dos ideas en la misma oración."}
 ]},
{id:"b2-r1",level:"B2",skill:"reading",title:"Una noticia de empleo",desc:"Leer un texto informativo y captar la postura",
 learn:{text:"Lee el texto. Identifica el tema, el dato principal y la conclusión.",
  passage:"Nearshoring has brought thousands of new jobs to northern Mexico over the past few years. Manufacturing plants, logistics centers and software companies are looking for workers who can communicate with partners in the United States and Canada. However, many employers report that finding bilingual candidates remains difficult. As a result, some companies now offer English classes during working hours. Experts believe that workers who improve their English could earn significantly more than those who do not.",
  rules:["La idea principal suele estar en la primera oración","However marca un problema o contraste","As a result marca una consecuencia"],
  tip:"Subraya mentalmente los conectores. Te guían por la estructura del texto."},
 ex:[
  {t:"mc",q:"¿Cuál es el tema principal?",o:["La falta de fábricas en el norte","El nearshoring y la demanda de trabajadores bilingües","Los salarios en Canadá"],a:1,why:"El texto habla de empleos por nearshoring y la necesidad de inglés."},
  {t:"mc",q:"¿Qué problema mencionan los empleadores?",o:["No hay suficientes oficinas","Es difícil encontrar candidatos bilingües","Los trabajadores no quieren mudarse"],a:1,why:"Finding bilingual candidates remains difficult."},
  {t:"mc",q:"¿Qué hacen algunas empresas como respuesta?",o:["Dan clases de inglés en horario laboral","Contratan solo extranjeros","Cierran sus plantas"],a:0,why:"Some companies now offer English classes during working hours."}
 ]},
{id:"b2-s1",level:"B2",skill:"speaking",title:"Entrevista de trabajo",desc:"Responder con seguridad las preguntas clave",
 learn:{text:"Responde con la estructura situación, acción y resultado. Practica frases que puedes adaptar.",
  rules:["Tell me about yourself. Resume tu formación, experiencia y meta","What are your strengths? Da una fortaleza con un ejemplo","Why should we hire you? Conecta tus habilidades con el puesto"],
  examples:[["I'm a fast learner and I work well under pressure.","Aprendo rápido y trabajo bien bajo presión."]],
  tip:"Habla en pasado para tus logros. I led, I improved, I organized."},
 ex:[
  {t:"speak",q:"Di esta frase en voz alta",say:"I have two years of experience in customer service."},
  {t:"speak",q:"Di esta frase en voz alta",say:"One of my strengths is that I adapt quickly to new situations."},
  {t:"speak",q:"Di esta frase en voz alta",say:"I would like to grow professionally in a company like yours."}
 ]},
{id:"b2-w1",level:"B2",skill:"writing",title:"Ensayo argumentativo",desc:"Defender una postura con razones",
 learn:{text:"Un párrafo argumentativo tiene postura, dos razones con ejemplos y una conclusión.",
  rules:["Postura clara al inicio","Firstly / Moreover para tus razones","However para reconocer el otro lado","In conclusion para cerrar"],
  examples:[["Firstly, it saves time.","En primer lugar, ahorra tiempo."],["However, some people disagree.","Sin embargo, algunas personas no están de acuerdo."]],
  tip:"Usa al menos un conector de contraste. Muestra que piensas críticamente."},
 ex:[
  {t:"essay",q:"Escribe un ensayo corto. ¿Debería ser obligatorio el inglés en todas las universidades de México? (mínimo 120 palabras)",min:120,
   checklist:["Mi postura es clara desde el inicio","Di al menos dos razones con ejemplos","Reconocí la otra postura con however u otro conector","Cerré con una conclusión"],
   model:"I believe English should be compulsory in all Mexican universities. Firstly, many well-paid jobs, especially in technology and international trade, require it. A graduate who speaks English can apply for positions in companies that work with the United States and Canada. Moreover, most scientific research is published in English, so students who read it have access to more knowledge. However, some people argue that not every career needs English and that it adds pressure to students who already have a heavy workload. This is a fair concern, but universities could offer flexible and practical courses adapted to each field. In conclusion, making English compulsory would give students more opportunities and prepare them for a global job market."}
 ]},
/* ---------------- C1 ---------------- */
{id:"c1-g1",level:"C1",skill:"grammar",title:"Inversión para dar énfasis",desc:"Estructuras formales que dan fuerza",
 learn:{text:"Con ciertas expresiones negativas al inicio, el auxiliar va antes del sujeto. Es típico del inglés formal.",
  rules:["Never have I seen… = Nunca he visto…","Hardly had I arrived when… = Apenas había llegado cuando…","Not only did she win, but she also… = No ganó únicamente, también…"],
  examples:[["Never have I felt so proud.","Nunca me he sentido tan orgulloso."],["Rarely do we see such talent.","Rara vez vemos tanto talento."]],
  tip:"Después de la expresión va el auxiliar (have, did, do) y luego el sujeto."},
 ex:[
  {t:"mc",q:"Completa «Never ___ such a beautiful place.»",o:["I have seen","have I seen","I saw"],a:1,why:"Con never al inicio se invierte. Have I seen."},
  {t:"mc",q:"Completa «Hardly ___ when it started to rain.»",o:["had we left","we had left","did we left"],a:0,why:"Hardly + had + sujeto + participio."},
  {t:"order",q:"Ordena «Rara vez escucho esa canción»",w:["Rarely","do","I","hear","that","song"],why:"Rarely + do + sujeto + verbo."}
 ]},
{id:"c1-g2",level:"C1",skill:"grammar",title:"Cleft sentences y subjuntivo",desc:"Destacar información y hacer recomendaciones formales",
 learn:{text:"Las cleft sentences dividen la oración para resaltar una parte. El subjuntivo aparece en recomendaciones formales.",
  rules:["It was Ana who solved the problem. (destaca a Ana)","What I need is more time. (destaca lo que necesito)","It is essential that he be on time. (subjuntivo, verbo base)"],
  examples:[["What surprised me was the price.","Lo que me sorprendió fue el precio."],["The doctor recommended that she rest.","El doctor recomendó que descansara."]],
  tip:"En el subjuntivo inglés el verbo no lleva -s. She rest, he be."},
 ex:[
  {t:"mc",q:"«Lo que más me gusta es viajar»",o:["What I like most is traveling","That I like most is traveling","The thing I like most traveling"],a:0,why:"What + sujeto + verbo + is…"},
  {t:"mc",q:"Completa «It is vital that every student ___ the form.»",o:["submits","submit","submitted"],a:1,why:"Subjuntivo. Verbo base sin -s."},
  {t:"fill",q:"«It was my teacher ___ encouraged me.»",a:["who","that"],why:"It was + persona + who."}
 ]},
{id:"c1-v1",level:"C1",skill:"vocabulary",title:"Registro académico",desc:"Pasar del inglés casual al formal",
 learn:{text:"En textos académicos se prefieren verbos de origen latino y frases más precisas.",
  rules:["get → obtain · show → demonstrate · find out → discover","a lot of → a significant number of","think → argue / suggest / claim"],
  examples:[["The study demonstrates a clear link.","El estudio demuestra una relación clara."],["Researchers argue that…","Los investigadores sostienen que…"]],
  tip:"Para el hispanohablante es una ventaja. Muchas palabras formales se parecen al español."},
 ex:[
  {t:"mc",q:"Versión académica de «We found out that…»",o:["We discovered that…","We got that…","We saw out that…"],a:0,why:"Discover es la opción formal de find out."},
  {t:"mc",q:"Versión académica de «a lot of people»",o:["loads of people","a considerable number of people","many many people"],a:1,why:"A considerable number of es preciso y formal."},
  {t:"fill",q:"Formal de «show». «The results ___ an improvement.»",a:["demonstrate","indicate","reveal"],why:"Demonstrate, indicate o reveal son verbos académicos."}
 ]},
{id:"c1-s1",level:"C1",skill:"speaking",title:"Hablar en reuniones",desc:"Interrumpir, matizar y proponer con tacto",
 learn:{text:"En reuniones profesionales importa cómo dices las cosas. Estas frases suavizan y ordenan tu participación.",
  rules:["Interrumpir. Sorry to interrupt, but…","Matizar. I see your point, however…","Proponer. Would it make sense to…?"],
  examples:[["If I may add something…","Si me permiten agregar algo…"]],
  tip:"Un buen ritmo natural une palabras. Practica sin pausas entre cada una."},
 ex:[
  {t:"speak",q:"Di esta frase en voz alta",say:"Sorry to interrupt, but I think we should consider the budget first."},
  {t:"speak",q:"Di esta frase en voz alta",say:"I see your point, however the data suggests otherwise."},
  {t:"speak",q:"Di esta frase en voz alta",say:"Would it make sense to postpone the launch until next quarter?"}
 ]},
{id:"c1-w1",level:"C1",skill:"writing",title:"Resumen de un texto",desc:"Sintetizar ideas con tus propias palabras",
 learn:{text:"Un buen resumen presenta la idea central, los puntos clave y omite ejemplos menores.",
  rules:["Empieza con The text discusses… / The author argues…","Parafrasea, no copies frases","Usa conectores de cohesión. Furthermore, In contrast, Overall"],
  tip:"Escribe el resumen sin ver el texto. Después compara."},
 ex:[
  {t:"essay",q:"Resume en inglés (mínimo 80 palabras) el texto sobre nearshoring de la lección B2 Reading, o cualquier artículo que hayas leído esta semana.",min:80,
   checklist:["Abrí con la idea central","Incluí los puntos clave sin ejemplos menores","Usé mis propias palabras","Usé al menos dos conectores formales"],
   model:"The text discusses how nearshoring has increased employment opportunities in northern Mexico. It explains that factories, logistics firms and software companies need staff able to communicate with North American partners. Nevertheless, employers struggle to find bilingual candidates, which has led several companies to provide English training during work hours. Furthermore, experts suggest that improving English proficiency could substantially raise workers' incomes. Overall, the article highlights English as a key factor for economic mobility in the region."}
 ]},
/* ---------------- C2 ---------------- */
{id:"c2-v1",level:"C2",skill:"vocabulary",title:"Idioms y lenguaje figurado",desc:"Expresiones que usan los hablantes nativos",
 learn:{text:"Los idioms no se traducen palabra por palabra. Hay que aprender su sentido completo.",
  rules:["Break the ice = romper el hielo","Hit the nail on the head = dar en el clavo","A blessing in disguise = no hay mal que por bien no venga","Bite off more than you can chew = abarcar demasiado"],
  examples:[["Losing that job was a blessing in disguise.","Perder ese trabajo fue para bien."]],
  tip:"Úsalos con moderación en textos formales. Brillan en la conversación."},
 ex:[
  {t:"mc",q:"«You hit the nail on the head» significa…",o:["Te lastimaste","Diste en el clavo","Te equivocaste"],a:1,why:"Significa acertar exactamente."},
  {t:"mc",q:"«Abarqué demasiado» en inglés natural",o:["I bit off more than I could chew","I ate too much","I took a lot"],a:0,why:"Bite off more than you can chew es el idiom equivalente."},
  {t:"mc",q:"«It's not my cup of tea» significa…",o:["No es mi taza","No es lo mío","No tomo té"],a:1,why:"Se usa para decir que algo no te gusta o no va contigo."}
 ]},
{id:"c2-l1",level:"C2",skill:"listening",title:"Variedades del inglés",desc:"Británico, americano y australiano",
 learn:{text:"El inglés cambia por región en vocabulario, ortografía y acento.",
  rules:["Británico vs americano. flat / apartment · lift / elevator · queue / line","Ortografía. colour / color · organise / organize","Australiano. arvo = afternoon · brekkie = breakfast"],
  tip:"Escucha podcasts de distintos países para entrenar tu oído."},
 ex:[
  {t:"mc",q:"Un británico dice «Take the lift to the third floor». ¿Qué es lift?",o:["Escaleras","Elevador","Coche"],a:1,why:"Lift es británico. En Estados Unidos dicen elevator."},
  {t:"mc",q:"«Let's meet this arvo» en Australia significa…",o:["esta tarde","este año","esta noche"],a:0,why:"Arvo es afternoon."},
  {t:"listen",q:"¿Qué palabra oíste?",say:"Please join the queue.",o:["queue (fila)","cue (señal)","key (llave)"],a:0,why:"Queue, británico para line (fila), suena igual que cue. El contexto lo aclara."}
 ]},
{id:"c2-s1",level:"C2",skill:"speaking",title:"Persuasión y retórica",desc:"Convencer con estructura y ritmo",
 learn:{text:"Un discurso persuasivo usa preguntas retóricas, grupos de tres y contraste.",
  rules:["Pregunta retórica. Can we really afford to wait?","Regla de tres. faster, cheaper and better","Contraste. It's not a cost, it's an investment."],
  tip:"Las pausas también comunican. Haz una pausa antes de tu idea más fuerte."},
 ex:[
  {t:"speak",q:"Di esta frase con convicción",say:"Can we really afford to ignore this opportunity?"},
  {t:"speak",q:"Di esta frase con convicción",say:"Our plan is faster, cheaper and far more effective."},
  {t:"speak",q:"Di esta frase con convicción",say:"Education is not an expense, it is an investment in our future."}
 ]},
{id:"c2-w1",level:"C2",skill:"writing",title:"Artículo de opinión",desc:"Escribir con estilo, matiz y voz propia",
 learn:{text:"Un artículo de opinión atrapa desde el título, sostiene una tesis y cierra con una idea memorable.",
  rules:["Abre con un dato, una anécdota o una pregunta","Combina estructuras complejas (inversión, cleft sentences)","Cierra con una llamada a la acción"],
  tip:"Lee tu texto en voz alta. Si suena natural, el ritmo es correcto."},
 ex:[
  {t:"essay",q:"Escribe un artículo de opinión con título sobre el papel del inglés en el futuro de los jóvenes mexicanos (mínimo 150 palabras).",min:150,
   checklist:["Tiene título y una apertura que atrapa","Sostiene una tesis clara","Usé al menos una estructura avanzada (inversión, cleft, subjuntivo)","Cierra con una idea memorable"],
   model:"The Language of Opportunity\n\nNever before have young Mexicans had so many doors within reach, and rarely have those doors been so firmly locked by a single key. What separates a good job from a great one is, increasingly, the ability to speak English.\n\nNearshoring has brought international companies to our cities, yet many positions remain unfilled. It is not talent that is missing; it is access. Private lessons are expensive, schedules are rigid, and traditional courses focus on grammar rather than conversation.\n\nIt is essential that this change. Flexible, affordable and practical learning should be the norm, not the exception. When a student in Reynosa can practise speaking on the bus home, the playing field begins to level.\n\nEnglish is not a luxury. It is the language of opportunity, and our generation deserves to speak it."}
 ]}
];

/* Examen de colocación: dos preguntas por nivel */
const PLACEMENT=[
 {lv:"A1",q:"Completa «She ___ a teacher.»",o:["are","is","am"],a:1},
 {lv:"A1",q:"Completa «___ you like coffee?»",o:["Does","Are","Do"],a:2},
 {lv:"A2",q:"Completa «Last year we ___ to Oaxaca.»",o:["go","went","have gone"],a:1},
 {lv:"A2",q:"Completa «This phone is ___ than that one.»",o:["more cheap","cheaper","cheapest"],a:1},
 {lv:"B1",q:"Completa «I ___ here since 2023.»",o:["live","lived","have lived"],a:2},
 {lv:"B1",q:"Completa «If I ___ more time, I would travel.»",o:["have","had","will have"],a:1},
 {lv:"B2",q:"Completa «If she had studied, she ___ passed.»",o:["would have","will have","would"],a:0},
 {lv:"B2",q:"Completa «___ the traffic, we arrived on time.»",o:["Although","Despite","However"],a:1},
 {lv:"C1",q:"Completa «Never ___ such a mess.»",o:["I have seen","have I seen","I saw"],a:1},
 {lv:"C1",q:"Completa «It is essential that he ___ present.»",o:["is","be","will be"],a:1},
 {lv:"C2",q:"«It's a blessing in disguise» significa…",o:["Es un regalo envuelto","No hay mal que por bien no venga","Es una bendición falsa"],a:1},
 {lv:"C2",q:"Elige la opción más precisa y formal",o:["The findings kind of show a link","The findings point to a tenuous correlation","The findings say there's a thing"],a:1}
];

const PHRASES=[
  {es:"¿Me puedes ayudar?",en:"Could you help me?",ctx:"Pedir ayuda",tip:"«Could» suena más amable que «can»."},
  {es:"No entendí",en:"Sorry, I didn't catch that",ctx:"Conversación",tip:"Más natural que «I don't understand»."},
  {es:"¿Me lo puedes repetir?",en:"Could you say that again?",ctx:"Conversación",tip:""},
  {es:"Más despacio, por favor",en:"Could you speak more slowly, please?",ctx:"Conversación",tip:""},

const DEMO_KEY="educa-demo-db";
function demoDB(){try{return JSON.parse(localStorage.getItem(DEMO_KEY))||{users:{},coords:{},session:null};}catch(e){return {users:{},coords:{},session:null};}}
function demoSave(d){try{localStorage.setItem(DEMO_KEY,JSON.stringify(d));}catch(e){}}
async function hash(s){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");}catch(e){return "x"+s.length+s;}}
const demoErr=(code)=>Object.assign(new Error(code),{code});
const DemoBackend={
  mode:"demo",
  async init(){const d=demoDB();return d.session&&d.users[d.session]?d.session:null;},
  async signUp(email,pass){const d=demoDB();const e=email.toLowerCase();if(Object.values(d.users).some(u=>u.email===e))throw demoErr("auth/email-already-in-use");const uid="demo-"+Date.now().toString(36);d.users[uid]={email:e,hash:await hash(pass)};d.session=uid;demoSave(d);return uid;},
  async signIn(email,pass){const d=demoDB();const e=email.toLowerCase();const h=await hash(pass);const id=Object.keys(d.users).find(k=>d.users[k].email===e);if(!id||d.users[id].hash!==h)throw demoErr("auth/invalid-credential");d.session=id;demoSave(d);return id;},
  async signOut(){const d=demoDB();d.session=null;demoSave(d);},
  async reset(){throw demoErr("demo/no-reset");},
  async deleteMe(){const d=demoDB();delete d.users[UID];d.session=null;demoSave(d);},
  async load(uid){const u=demoDB().users[uid];return u&&u.profile?{profile:u.profile,progress:u.progress||freshProgress()}:null;},
  async create(uid,profile,progress){const d=demoDB();Object.assign(d.users[uid],{profile,progress,lastActive:Date.now()});demoSave(d);},
  async save(uid,field,data){const d=demoDB();if(!d.users[uid])return;d.users[uid][field]=clone(data);d.users[uid].lastActive=Date.now();demoSave(d);},
  async isCoord(uid){return !!demoDB().coords[uid];},
  async makeCoord(uid,code,info){if(code!==(CFG.demoCoordinatorCode||"EDUCA2026"))throw demoErr("permission-denied");const d=demoDB();d.coords[uid]=info;demoSave(d);},
  async coordInfo(uid){return demoDB().coords[uid]||null;},

/* ---------- Firebase ---------- */
async function makeFirebase(){
  const V="10.12.2";
  const [{initializeApp},A,F]=await Promise.all([
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`),
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`)]);
  const app=initializeApp(CFG.firebase); const auth=A.getAuth(app); const db=F.getFirestore(app);
  auth.languageCode="es";
  const userRef=uid=>F.doc(db,"users",uid);
  let chain=Promise.resolve();
  return {
    mode:"firebase",
    init:()=>new Promise(res=>{const off=A.onAuthStateChanged(auth,u=>{off();res(u?u.uid:null);});}),
    async signUp(email,pass){return (await A.createUserWithEmailAndPassword(auth,email,pass)).user.uid;},
    async signIn(email,pass){return (await A.signInWithEmailAndPassword(auth,email,pass)).user.uid;},
    async signOut(){await A.signOut(auth);},
    async reset(email){await A.sendPasswordResetEmail(auth,email);},
    async deleteMe(){if(auth.currentUser)await A.deleteUser(auth.currentUser);},
    async load(uid){const s=await F.getDoc(userRef(uid));if(!s.exists())return null;const d=s.data();return d.profile?{profile:d.profile,progress:Object.assign(freshProgress(),d.progress||{})}:null;},
    async create(uid,profile,progress){await F.setDoc(userRef(uid),{profile,progress,createdAt:F.serverTimestamp(),lastActive:F.serverTimestamp()});},
    save(uid,field,data){const body=clone(data);chain=chain.then(()=>F.updateDoc(userRef(uid),{[field]:body,lastActive:F.serverTimestamp()}));return chain;},
    async isCoord(uid){try{return (await F.getDoc(F.doc(db,"coordinators",uid))).exists();}catch(e){return false;}},
    async makeCoord(uid,code,info){await F.setDoc(F.doc(db,"coordinators",uid),Object.assign({code},info,{createdAt:F.serverTimestamp()}));},
    async coordInfo(uid){const s=await F.getDoc(F.doc(db,"coordinators",uid));return s.exists()?s.data():null;},
    async listUsers(){const s=await F.getDocs(F.collection(db,"users"));return s.docs.map(d=>{const x=d.data();return {uid:d.id,profile:x.profile,progress:Object.assign(freshProgress(),x.progress||{}),lastActive:x.lastActive&&x.lastActive.toMillis?x.lastActive.toMillis():0};}).filter(u=>u.profile);},
    async tts(text,speed){
      const token=await auth.currentUser.getIdToken();
      const r=await fetch(CFG.ttsEndpoint||"/api/tts",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify({text,speed})});
      if(!r.ok) throw new Error("tts");
      return URL.createObjectURL(await r.blob());
    },
    async ai(prompt,tier){
      const token=await auth.currentUser.getIdToken();
      const r=await fetch(CFG.aiEndpoint||"/api/ai",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify({prompt,tier})});
      const j=await r.json().catch(()=>({}));
      if(!r.ok) throw Object.assign(new Error(j.error||"ai"),{code:r.status===429?"rate_limited":"upstream_error"});
      return j.data;
    }
  };
}

function makeDictation(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR) return null;
  let rec=null, onP=()=>{}, onF=()=>{}, onS=()=>{};
  return {
    onPartial(f){onP=f;}, onFinal(f){onF=f;}, onState(f){onS=f;},
    start(opts){return new Promise((res,rej)=>{
      try{rec&&rec.abort();}catch(e){}
      rec=new SR(); rec.lang=(opts&&opts.language)||"en-US"; rec.interimResults=true; rec.continuous=false;
      rec.onstart=()=>{onS({state:"listening"});res();};
      rec.onresult=ev=>{let fin="",tmp="";for(let i=ev.resultIndex;i<ev.results.length;i++){const t=ev.results[i][0].transcript;ev.results[i].isFinal?fin+=t:tmp+=t;}if(tmp)onP({text:tmp});if(fin)onF({text:fin.trim()});};
      rec.onerror=ev=>{onS({state:"idle",reason:ev.error});rej({code:ev.error==="not-allowed"?"not_granted":"upstream_error"});};
      rec.onend=()=>onS({state:"idle",reason:"stopped"});
      try{rec.start();}catch(e){rej({code:"upstream_error"});}
    });},
    stop(){try{rec&&rec.stop();}catch(e){}return Promise.resolve();}
  };
}

/* Sonidos generados en el navegador, sin archivos */
const SFX={
  ctx:null,
  on(){return PREF.get("sound","on")==="on";},
  notes(list,type,vol){
    if(!this.on())return;
    try{
      const C=this.ctx||(this.ctx=new (window.AudioContext||window.webkitAudioContext)());
      if(C.state==="suspended")C.resume();
      let t=C.currentTime;
      list.forEach(([f,d])=>{const o=C.createOscillator(),g=C.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(C.destination);o.start(t);o.stop(t+d+.02);t+=d*.75;});
    }catch(e){}
  },
  correct(){this.notes([[660,.12],[990,.22]],"triangle",.16);},
  wrong(){this.notes([[311,.16],[233,.26]],"sine",.12);},
  complete(){this.notes([[523,.14],[659,.14],[784,.14],[1047,.35]],"triangle",.15);},
  streak(){this.notes([[784,.1],[988,.1],[1175,.3]],"square",.06);},
  tap(){this.notes([[880,.05]],"sine",.05);}
};

/* Voz más natural: elige la mejor voz en inglés del dispositivo */
let VOICES=[];
function loadVoices(){try{VOICES=speechSynthesis.getVoices().filter(v=>/^en(-|_)/i.test(v.lang));}catch(e){VOICES=[];}}
try{loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}catch(e){}
function bestVoice(){
  const pick=PREF.get("voice","");
  if(pick){const v=VOICES.find(x=>x.name===pick);if(v)return v;}
  const rank=v=>{const n=v.name;let s=0;
    if(/natural|neural|online/i.test(n))s+=50;
    if(/Google US English|Google UK English Female/i.test(n))s+=40;
    if(/Samantha|Ava|Allison|Aria|Jenny|Emma|Michelle|Serena|Karen|Moira/i.test(n))s+=30;
    if(/en-US/i.test(v.lang))s+=10;
    if(/Fred|Albert|Bad News|Bells|Boing|Bubbles|Cellos|Whisper|Zarvox|Trinoids|Jester|Organ|Superstar|Ralph|Junior|Kathy|Wobble|Good News/i.test(n))s-=100;
    return s;};
  return [...VOICES].sort((a,b)=>rank(b)-rank(a))[0]||null;
}
const TTS_CACHE=new Map();
let CUR_AUDIO=null;
function say(text,rate){
  if(CFG.neuralVoice&&BE.tts){
    const key=text+"|"+(rate||1);
    const play=url=>{try{if(CUR_AUDIO)CUR_AUDIO.pause();CUR_AUDIO=new Audio(url);CUR_AUDIO.play().catch(()=>webSay(text,rate));}catch(e){webSay(text,rate);}};
    if(TTS_CACHE.has(key))return play(TTS_CACHE.get(key));
    BE.tts(text,rate||1).then(url=>{TTS_CACHE.set(key,url);play(url);}).catch(()=>webSay(text,rate));
    return;
  }
  webSay(text,rate);
}
function webSay(text,rate){
  try{
    if(!VOICES.length)loadVoices();
    const u=new SpeechSynthesisUtterance(text);const v=bestVoice();
    if(v){u.voice=v;u.lang=v.lang;}else u.lang="en-US";
    u.rate=rate?rate:.95;u.pitch=1.05;
    speechSynthesis.cancel();speechSynthesis.speak(u);
  }catch(e){toast("Tu navegador no reproduce audio aquí");}
}

function weekDots(){
  const L=["D","L","M","M","J","V","S"];const out=[];const now=new Date();
  const lastDate=P.last?new Date(P.last+"T12:00:00"):null;
  for(let k=6;k>=0;k--){
    const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-k,12);
    let on=false;
    if(lastDate&&P.streak>0){const diff=Math.round((lastDate-d)/864e5);on=diff>=0&&diff<P.streak;}
    out.push(`<div class="wd ${on?"on":""} ${k===0?"today":""}"><i>${on?"🔥":""}</i><span>${L[d.getDay()]}</span></div>`);
  }
  return out.join("");
}

  view.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>say(b.dataset.say));
  if(L.passage) $("#readall").onclick=()=>say(L.passage.replace(/\n+/g," "));
  $("#practice").onclick=()=>play(l.ex.map((e,n)=>Object.assign({key:l.id+"#"+n},e)),{title:l.title,onDone:(res)=>finishLesson(l,res),passage:L.passage});
  window.scrollTo(0,0);
}
