let DICT_TARGET=null;
function wireDictation(){
  if(!DICT) return;
  DICT.onPartial(({text})=>DICT_TARGET&&DICT_TARGET.partial(text));
  DICT.onFinal(({text})=>DICT_TARGET&&DICT_TARGET.final(text));
  DICT.onState(({state})=>DICT_TARGET&&DICT_TARGET.state(state));
}
function play(items,opts){
  let i=0; const results=[];
  function render(){
    if(i>=items.length){DICT_TARGET=null;return opts.onDone(results);}
    const e=items[i]; let picked=null, built=[], answered=false;
    const label={mc:"Elige la respuesta",fill:"Completa",order:"Arma la frase",write:"Traduce",listen:"Escucha",speak:"Speaking",essay:"Writing"}[e.t];
    view.innerHTML=`<div class="player">
      <div class="row" style="justify-content:space-between"><button class="btn ghost" id="quit">Salir</button><span class="muted" style="font-weight:700">${i+1} / ${items.length}</span></div>
      <div class="bar"><i style="width:${i/items.length*100}%"></i></div>
      ${opts.passage&&e.t==="mc"?`<details class="card"><summary style="font-weight:700;cursor:pointer">Ver el texto</summary><div class="passage">${esc(opts.passage).replace(/\n/g,"<br>")}</div></details>`:""}
      <span class="eyebrow">${label}</span>
      <p class="prompt">${esc(e.q)}</p>
      <div id="body" class="stack"></div>
      <div id="fb"></div>
      <button class="btn block" id="check" disabled>Comprobar</button>
    </div>`;
    $("#quit").onclick=()=>{DICT_TARGET=null;if(DICT)DICT.stop().catch(()=>{});opts.onQuit?opts.onQuit():lecciones();};
    const body=$("#body"), check=$("#check");
    const ready=v=>check.disabled=!v;

    if(e.t==="mc"||e.t==="listen"){
      body.innerHTML=(e.t==="listen"?`<div class="row"><button class="speak" id="hear">🔊 Reproducir</button><button class="speak" id="slow">🐢 Lento</button></div>`:"")+
        `<div class="opts">${e.o.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join("")}</div>`;
      if(e.t==="listen"){$("#hear").onclick=()=>say(e.say);$("#slow").onclick=()=>say(e.say,.7);}
      body.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(answered)return;body.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");picked=+b.dataset.k;ready(true);});
    } else if(e.t==="order"){
      const sh=e.w.map((w,k)=>({w,k})).sort(()=>Math.random()-.5);
      body.innerHTML=`<div class="answer-line" id="line"></div><div class="words">${sh.map(s=>`<button class="word" data-k="${s.k}" aria-pressed="false">${esc(s.w)}</button>`).join("")}</div>`;
      body.querySelectorAll(".words .word").forEach(b=>b.onclick=()=>{
        if(answered||b.getAttribute("aria-pressed")==="true")return;
        b.setAttribute("aria-pressed","true");built.push(+b.dataset.k);
        const c=document.createElement("button");c.className="word";c.textContent=b.textContent;
        c.onclick=()=>{if(answered)return;built.splice(built.indexOf(+b.dataset.k),1);c.remove();b.setAttribute("aria-pressed","false");ready(built.length===e.w.length);};
        $("#line").appendChild(c);ready(built.length===e.w.length);
      });
    } else if(e.t==="write"||e.t==="fill"){
      body.innerHTML=`<input type="text" id="ans" autocomplete="off" autocapitalize="off" placeholder="${e.t==="fill"?"Escribe la palabra que falta":"Escribe tu respuesta en inglés"}">`;
      const inp=$("#ans");inp.oninput=()=>ready(inp.value.trim());inp.focus();
      inp.onkeydown=ev=>{if(ev.key==="Enter"&&!check.disabled)check.click();};
    } else if(e.t==="speak"){
      speakUI(e,body,ready);
    } else if(e.t==="essay"){
      essayUI(e,body,ready,check);
    }

    check.onclick=()=>{
      if(answered){i++;return render();}
      answered=true;
      let ok=false, correct="", extra="";
      if(e.t==="mc"||e.t==="listen"){ok=picked===e.a;correct=e.o[e.a];
        body.querySelectorAll(".opt").forEach(b=>{const k=+b.dataset.k;if(k===e.a)b.classList.add("right");else if(k===picked)b.classList.add("wrong");});}
      else if(e.t==="order"){ok=built.map(k=>e.w[k]).join(" ")===e.w.join(" ");correct=e.w.join(" ");}
      else if(e.t==="write"||e.t==="fill"){const v=norm($("#ans").value);ok=e.a.some(a=>norm(a)===v);correct=e.a[0];$("#ans").disabled=true;}
      else if(e.t==="speak"){const r=body._score();ok=r>=.8;correct=e.say;extra=DICT?`Pronunciaste bien ${Math.round(r*100)}% de las palabras.`:(ok?"Sigue practicando en voz alta todos los días.":"Escucha el modelo en lento y repite por partes.");if(DICT)DICT.stop().catch(()=>{});}
      else if(e.t==="essay"){ok=true;const t=$("#essay").value.trim();P.essays[e.key.replace("#","_")]=t.slice(0,4000);}
      results.push({key:e.key,ok,t:e.t});
      const fb=$("#fb");
      const praise=["¡Muy bien!","¡Excelente!","¡Así se hace!","¡Perfecto!"][Math.floor(Math.random()*4)];
      if(e.t==="essay") fb.innerHTML=`<div class="feedback ok">${mascot("cheer",52)}<div><b>Texto guardado en tu cuenta ✍️</b><span class="why">Puedes volver a esta lección para mejorarlo.</span></div></div>`;
      else fb.innerHTML=ok?`<div class="feedback ok">${mascot("cheer",52)}<div><b>${praise}</b>${extra?`<span class="why">${esc(extra)}</span>`:""}${e.why?`<span class="why">${esc(e.why)}</span>`:""}</div></div>`
        :`<div class="feedback no">${mascot("think",52)}<div><b>${e.t==="speak"?"Casi. Inténtalo otra vez con calma.":`Casi. La respuesta correcta es «${esc(correct)}».`}</b>${extra?`<span class="why">${esc(extra)}</span>`:""}${e.why?`<span class="why">${esc(e.why)}</span>`:""}</div></div>`;
      if(e.t!=="essay") (ok?SFX.correct():SFX.wrong()); else SFX.correct();
      if(e.t!=="essay"&&e.t!=="speak"&&!ok) say(e.t==="listen"?e.say:correct);
      check.textContent=i===items.length-1?"Ver resultados":"Continuar"; check.disabled=false;
    };
  }
  render();
}

function speakUI(e,body,ready){
  let heard="", live="";
  const target=norm(e.say).split(" ");
  const score=()=>{const h=new Set(norm(heard).split(" "));return target.filter(w=>h.has(w)).length/target.length;};
  body._score=score;
  const paint=()=>{
    const h=new Set(norm(heard).split(" "));
    $("#heard").innerHTML=heard||live?`${heard?`<div>${e.say.split(" ").map(w=>`<span class="${h.has(norm(w))?"hit":"miss"}">${esc(w)}</span>`).join(" ")}</div>`:""}<div class="muted" style="font-size:14px;margin-top:6px">Te escuché. «${esc((heard+" "+live).trim())}»</div>`:`<span class="muted">Aquí aparecerá lo que digas.</span>`;
  };
  body.innerHTML=`<section class="card" style="align-items:flex-start"><b style="font-family:var(--display);font-size:22px">${esc(e.say)}</b>
     <div class="row"><button class="speak" id="hear">🔊 Escuchar modelo</button><button class="speak" id="slow">🐢 Lento</button></div></section>
     ${DICT?`<button class="mic" id="mic" aria-label="Hablar">🎙️</button><p class="note" style="text-align:center" id="micnote">Toca el micrófono y di la frase</p>`:
       `<p class="notice">Para que Educa escuche tu voz, abre esta página en Google Chrome o Microsoft Edge. Mientras tanto practica así. Escucha el modelo, repite la frase en voz alta tres veces y califícate.</p><div class="selfcheck"><button type="button" data-sc="1">😊 Me salió bien</button><button type="button" data-sc="0">🔁 Necesito practicar</button></div>`}
     <div class="heard" id="heard"></div>`;
  $("#hear").onclick=()=>say(e.say);$("#slow").onclick=()=>say(e.say,.7);
  paint();
  if(DICT){
    const mic=$("#mic");
    DICT_TARGET={partial:t=>{live=t;paint();},final:t=>{heard=(heard+" "+t).trim();live="";paint();ready(true);},
      state:s=>{mic.classList.toggle("on",s==="listening");$("#micnote").textContent=s==="listening"?"Te escucho… toca otra vez para terminar":"Toca el micrófono y di la frase";}};
    mic.onclick=()=>{
      if(mic.classList.contains("on")){DICT.stop().catch(()=>{});return;}
      heard="";live="";paint();
      DICT.start({language:"en-US"}).catch(err=>{
        if(err&&err.code==="not_granted"){toast("Permiso de micrófono denegado. Puedes escribir la frase.");}
        else if(err&&err.code!=="stopped"&&err.code!=="dismissed"){toast("No pudimos usar el micrófono. Inténtalo de nuevo.");}
      });
    };
  } else {
    $("#heard").hidden=true;
    body.querySelectorAll("[data-sc]").forEach(b=>b.onclick=()=>{body.querySelectorAll("[data-sc]").forEach(x=>x.setAttribute("aria-pressed",x===b));body._score=()=>b.dataset.sc==="1"?1:.5;ready(true);});
  }
}

/* Resultados y guardado */
function addReview(results){
  const wrong=results.filter(r=>!r.ok&&r.t!=="essay"&&r.t!=="speak").map(r=>r.key);
  const right=new Set(results.filter(r=>r.ok).map(r=>r.key));
  P.review=[...new Set([...P.review.filter(k=>!right.has(k)),...wrong])].slice(-40);
}
async function finishLesson(l,res){
  const score=Math.round(res.filter(r=>r.ok).length/res.length*100);
  const prev=P.lessons[l.id]||{best:0,attempts:0};
  P.lessons[l.id]={best:Math.max(prev.best,score),attempts:prev.attempts+1,passed:prev.passed||score>=70,at:new Date().toISOString()};
  P.xp+=res.filter(r=>r.ok).length*10; bumpStreak(); addReview(res);
  await persist("progress",P); paintStats();
  resultScreen(score,score>=70?`Lección completa. Ganaste ${res.filter(r=>r.ok).length*10} XP.`:"Necesitas 70% para completarla. Repasa la explicación e inténtalo otra vez.",
    [["Repetir",()=>openLesson(l.id)],["Ver lecciones",lecciones]]);
}
function resultScreen(score,msg,actions){
  const good=score>=70;
  if(good){SFX.complete();confetti();}else SFX.wrong();
  view.innerHTML=`<div class="result-ajo">${mascot(good?"cheer":"think",120)}</div><section class="hero" style="text-align:center;align-items:center">
    <span class="eyebrow">Resultado</span><h1>${score}%</h1><p>${esc(msg)}</p>
    <p style="font-size:14px;opacity:.9">Racha de ${P.streak} ${P.streak===1?"día":"días"} · ${MODE==="firebase"?"Progreso guardado en tu cuenta":"Progreso guardado en este navegador"}</p>
    <div class="row" style="justify-content:center">${actions.map((a,k)=>`<button class="btn" data-a="${k}" ${k?'style="background:var(--surface);color:var(--ink)"':""}>${a[0]}</button>`).join("")}</div></section>`;
  view.querySelectorAll("[data-a]").forEach(b=>b.onclick=actions[+b.dataset.a][1]);
}
function findItem(key){const [id,n]=key.split("#");const l=LESSONS.find(x=>x.id===id);return l&&l.ex[+n]?Object.assign({key},l.ex[+n]):null;}
function review(){
  const items=P.review.map(findItem).filter(Boolean).slice(0,8);
  if(!items.length){P.review=[];return inicio();}
  setTab("inicio");
  play(items,{onQuit:inicio,onDone:async res=>{
    addReview(res); P.xp+=res.filter(r=>r.ok).length*5; bumpStreak(); await persist("progress",P); paintStats();
    resultScreen(Math.round(res.filter(r=>r.ok).length/res.length*100),"Las preguntas que acertaste salen del repaso. Las demás regresan la próxima vez.",[["Ir a inicio",inicio]]);
  }});
}
function levelExam(lvId){
  const pool=LESSONS.filter(l=>l.level===lvId).flatMap(l=>l.ex.map((e,n)=>Object.assign({key:l.id+"#"+n},e))).filter(e=>["mc","fill","write","order","listen"].includes(e.t));
  const items=pool.sort(()=>Math.random()-.5).slice(0,10);
  setTab("inicio");
  play(items,{onQuit:lecciones,onDone:async res=>{
    const score=Math.round(res.filter(r=>r.ok).length/res.length*100);
    const prev=P.exams[lvId]||{best:0};
    P.exams[lvId]={best:Math.max(prev.best,score),passed:prev.passed||score>=70,at:new Date().toISOString()};
    P.xp+=res.filter(r=>r.ok).length*15; bumpStreak(); addReview(res); await persist("progress",P); paintStats();
    const ix=lvIndex(lvId);
    if(score>=70&&ix<LEVELS.length-1){LFILTER.level=LEVELS[ix+1].id;LFILTER.skill="all";}
    resultScreen(score,score>=70?(ix<LEVELS.length-1?`¡Aprobaste ${lvId}! Desbloqueaste ${LEVELS[ix+1].id} · ${LEVELS[ix+1].name}.`:"¡Completaste el plan de estudios de Educa!"):"Necesitas 70% para avanzar. Repasa las lecciones del nivel y vuelve a intentarlo.",
      [["Ver lecciones",lecciones],["Ir a inicio",inicio]]);
  }});
}

/* =====================================================================
   IMPRIMIBLES · secuencia didáctica en papel
   Activación de conocimientos previos → andamiaje → práctica variada
   (relacionar, sopa de letras, corregir errores) → trabajo colaborativo
   → producción propia → metacognición (semáforo y boleto de salida)
   ===================================================================== */
function seeded(str){let h=2166136261;for(const c of str){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return ()=>{h^=h<<13;h^=h>>>17;h^=h<<5;return ((h>>>0)%10000)/10000;};}
function lessonWords(l){
  const set=new Set();
  const add=s=>String(s||"").split(/[^A-Za-z]+/).forEach(w=>{if(w.length>=4&&w.length<=10)set.add(w.toUpperCase());});
  (l.learn.examples||[]).forEach(([en])=>add(en));
  l.ex.forEach(e=>{if(e.w)e.w.forEach(add);if(e.say)add(e.say);if(e.t==="mc"&&e.o)add(e.o[e.a]);if(e.a&&Array.isArray(e.a))add(e.a[0]);if(e.model)add(e.model);});
  const stop=new Set(["THAT","THIS","WITH","HAVE","FROM","YOUR","WHAT","WHEN","THEY","THEIR","THERE","WOULD","ABOUT","PLEASE"]);
  return [...set].filter(w=>!stop.has(w));
}
function wordSearch(words,rnd,size=12){
  const g=Array.from({length:size},()=>Array(size).fill(""));
  const placed=[];
  for(const w of words.sort((a,b)=>b.length-a.length)){
    if(placed.length>=8)break;
    for(let t=0;t<120;t++){
      const dir=rnd()<.5?[0,1]:[1,0]; const r=Math.floor(rnd()*size),c=Math.floor(rnd()*size);
      if(r+dir[0]*(w.length-1)>=size||c+dir[1]*(w.length-1)>=size)continue;
      let ok=true;for(let k=0;k<w.length;k++){const ch=g[r+dir[0]*k][c+dir[1]*k];if(ch&&ch!==w[k]){ok=false;break;}}
      if(!ok)continue;
      for(let k=0;k<w.length;k++)g[r+dir[0]*k][c+dir[1]*k]=w[k];
      placed.push(w);break;
    }
  }
  const A="ABCDEFGHIJKLMNOPRSTUVWY";
  for(const row of g)for(let k=0;k<size;k++)if(!row[k])row[k]=A[Math.floor(rnd()*A.length)];
  return {grid:g,words:placed};
}
function buildSheet(l){
  const rnd=seeded(l.id); const S=[]; const key=[];
  const sec=(title,method,html,text)=>S.push({title,method,html,text});
  const lines=n=>Array(n).fill('<div class="line"></div>').join("");
  const tl=n=>Array(n).fill("   ______________________________").join("\n");
  const L=l.learn;
  // 1. Activación
  sec("Calentamiento","Activación de conocimientos previos",
    `<p>Antes de leer la regla, escribe alrededor del círculo todo lo que ya sabes o se te ocurre sobre <b>${esc(l.title)}</b>. Pueden ser palabras, frases o ejemplos en inglés.</p>
     <div style="display:grid;place-items:center;height:150px;border:1.5px dashed #A79FB5;border-radius:8px"><div style="border:2px solid #1B1B1B;border-radius:50%;padding:18px 22px;font-weight:700;text-align:center">${esc(l.title)}</div></div>`,
    `Escribe alrededor de «${l.title}» todo lo que ya sabes sobre el tema.\n\n        ( ${l.title} )\n\n${tl(2)}`);

  if(L.rules||L.passage){
    sec("Lee y subraya","Andamiaje",
      `${L.passage?`<p style="white-space:pre-line;border:1px solid #CCC;padding:10px;border-radius:6px;font-size:14px">${esc(L.passage)}</p><p>Subraya con un color las palabras de tiempo y con otro los conectores.</p>`:""}
       ${L.rules?`<div style="border-left:4px solid #6B2FD6;padding-left:10px">${L.rules.map(r=>`<p style="font-size:14px">• ${esc(r)}</p>`).join("")}</div><p>Encierra en un círculo la palabra clave de cada regla. Después escribe un ejemplo propio para la primera regla.</p>${lines(1)}`:""}`,
      `${L.passage?L.passage+"\nSubraya palabras de tiempo y conectores.\n\n":""}${L.rules?L.rules.map(r=>"• "+r).join("\n")+"\nEncierra la palabra clave de cada regla y escribe un ejemplo propio.\n"+tl(1):""}`);
  }
  // 3. Relaciona columnas
  const pairs=(L.examples||[]).slice(0,5);
  if(pairs.length>=2){
    const letters="ABCDE"; const shuffled=pairs.map((p,i)=>({es:p[1],i})).sort(()=>rnd()-.5);
    sec("Relaciona las columnas","Recuperación activa",
      `<p>Une cada frase en inglés con su significado. Escribe la letra en la línea.</p>
       <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;font-size:14px">
        <div>${pairs.map((p,i)=>`<p>${i+1}. ${esc(p[0])} ____</p>`).join("")}</div>
        <div>${shuffled.map((s,k)=>`<p>${letters[k]}) ${esc(s.es)}</p>`).join("")}</div></div>`,
      pairs.map((p,i)=>`${i+1}. ${p[0]} ____`).join("\n")+"\n\n"+shuffled.map((s,k)=>`${letters[k]}) ${s.es}`).join("\n"));
    key.push("Relaciona. "+pairs.map((p,i)=>`${i+1}-${letters[shuffled.findIndex(s=>s.i===i)]}`).join(", "));
  }
  // 4. Sopa de letras
  const ws=wordSearch(lessonWords(l),rnd);
  if(ws.words.length>=4){
    sec("Sopa de letras","Reconocimiento visual del vocabulario",
      `<p>Encuentra estas palabras de la lección. Después escribe una oración con dos de ellas.</p>
       <p style="font-size:13px;font-weight:700">${ws.words.join(" · ")}</p>
       <div style="overflow-x:auto"><table style="border-collapse:collapse;margin:auto;font-family:ui-monospace,monospace;font-size:15px">${ws.grid.map(r=>`<tr>${r.map(c=>`<td style="width:24px;height:24px;text-align:center;border:1px solid #DDD">${c}</td>`).join("")}</tr>`).join("")}</table></div>${lines(1)}`,
      `Palabras. ${ws.words.join(", ")}\n\n`+ws.grid.map(r=>r.join(" ")).join("\n")+"\n\nEscribe una oración con dos de ellas.\n"+tl(1));
  }
  // 5. Encuentra el error
  const errs=l.ex.filter(e=>e.t==="mc"&&/«[^»]*___[^»]*»/.test(e.q)).slice(0,3).map(e=>{
    const base=e.q.match(/«([^»]*)»/)[1]; const wrong=e.o.find((o,k)=>k!==e.a);
    return {bad:base.replace("___",wrong),good:base.replace("___",e.o[e.a])};
  });
  if(errs.length){
    sec("Encuentra y corrige el error","Análisis de errores",
      `<p>Cada oración tiene un error. Táchalo y escribe la versión correcta.</p>${errs.map((x,i)=>`<p>${i+1}. ${esc(x.bad)}</p>${lines(1)}`).join("")}`,
      errs.map((x,i)=>`${i+1}. ${x.bad}\n${tl(1)}`).join("\n"));
    key.push("Errores. "+errs.map((x,i)=>`${i+1}) ${x.good}`).join(" · "));
  }
  // 6. Práctica de la lección
  const items=l.ex.filter(e=>e.t!=="essay"&&e.t!=="speak").map(e=>{
    if(e.t==="order"){key.push("Ordena. "+e.w.join(" "));return `Ordena las palabras. ${[...e.w].sort(()=>rnd()-.5).join(" / ")}`;}
    if(e.t==="listen"){key.push("Traduce. "+e.say);return `Traduce al inglés. ${e.o[e.a]}`;}
    if(e.t==="mc"){key.push(`${e.q} → ${e.o[e.a]}`);return `${e.q} (${e.o.join(" · ")})`;}
    key.push(`${e.q} → ${e.a[0]}`);return e.q;
  });
  if(items.length) sec("Práctica","Práctica guiada",
    `<ol>${items.map(t=>`<li>${esc(t)}${lines(1)}</li>`).join("")}</ol>`,
    items.map((t,n)=>`${n+1}. ${t}\n${tl(1)}`).join("\n"));
  // 7. En parejas
  const dict=[...(L.examples||[]).map(x=>x[0]),...l.ex.filter(e=>e.say).map(e=>e.say)].slice(0,6);
  if(dict.length>=2){
    const half=Math.ceil(dict.length/2);
    sec("En parejas","Aprendizaje colaborativo",
      `<p>Recorta por la línea. La persona A dicta sus frases y la persona B las escribe. Luego cambian. Al final comparen y corrijan juntos.</p>
       <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:14px">
         <div style="border:1.5px dashed #A79FB5;padding:10px;border-radius:6px"><b>Persona A dicta</b>${dict.slice(0,half).map(s=>`<p>• ${esc(s)}</p>`).join("")}<b>Escribe lo que te dicten</b>${lines(dict.length-half)}</div>
         <div style="border:1.5px dashed #A79FB5;padding:10px;border-radius:6px"><b>Persona B dicta</b>${dict.slice(half).map(s=>`<p>• ${esc(s)}</p>`).join("")}<b>Escribe lo que te dicten</b>${lines(half)}</div></div>`,
      `Persona A dicta.\n${dict.slice(0,half).map(s=>"• "+s).join("\n")}\n\nPersona B dicta.\n${dict.slice(half).map(s=>"• "+s).join("\n")}\n\nCada quien escribe lo que le dictan y al final comparan.`);
  }
  // 8. Producción
  const essay=l.ex.find(e=>e.t==="essay");
  if(essay){
    sec("Organiza y escribe","Escritura con andamiaje",
      `<p>${esc(essay.q)}</p><p>Planea antes de escribir.</p>
       <div style="display:grid;gap:8px">${["Inicio · ¿Qué vas a presentar?","Desarrollo · ideas y ejemplos","Cierre · ¿cómo terminas?"].map(b=>`<div style="border:1.5px solid #A79FB5;border-radius:6px;padding:8px;min-height:70px;font-size:13px;font-weight:700">${b}</div>`).join("")}</div>
       <p>Ahora escribe tu texto.</p>${lines(8)}
       <p style="font-size:13px"><b>Revisa con tu compañero.</b> ${essay.checklist.map(c=>"☐ "+esc(c)).join(" ")}</p>`,
      `${essay.q}\nPlanea. Inicio / Desarrollo / Cierre\n\n${tl(8)}\n\nRevisa con tu compañero.\n${essay.checklist.map(c=>"☐ "+c).join("\n")}`);
  } else {
    const starters=(L.examples||[]).slice(0,3).map(x=>x[0].split(" ").slice(0,2).join(" ")+" …");
    sec("Ahora tú","Producción personal",
      `<p>Escribe tres oraciones sobre tu vida usando lo que aprendiste.${starters.length?" Puedes empezar así.":""}</p>${starters.length?`<p style="font-size:14px">${starters.map(esc).join(" · ")}</p>`:""}${lines(3)}`,
      `Escribe tres oraciones sobre tu vida con lo que aprendiste.${starters.length?"\nInicios. "+starters.join(" · "):""}\n${tl(3)}`);
  }
  // 9. Metacognición
  const can=[l.desc,L.tip?"Evito el error común de esta lección":"Explico la regla con mis palabras","Lo uso sin ver mis notas"];
  sec("¿Cómo voy?","Autoevaluación",
    `<p>Colorea el semáforo. 🟢 Lo domino · 🟡 Casi · 🔴 Necesito repasar</p>
     ${can.map(c=>`<p style="font-size:14px">○ ○ ○ &nbsp; Puedo ${esc(c.charAt(0).toLowerCase()+c.slice(1))}.</p>`).join("")}
     <div style="border:2px solid #1B1B1B;border-radius:8px;padding:10px;margin-top:6px"><b>Boleto de salida ✂</b><p style="font-size:14px">Algo que aprendí hoy</p>${lines(1)}<p style="font-size:14px">Una duda que todavía tengo</p>${lines(1)}</div>`,
    `Semáforo (verde lo domino, amarillo casi, rojo repasar)\n${can.map(c=>"○ ○ ○  Puedo "+c.charAt(0).toLowerCase()+c.slice(1)+".").join("\n")}\n\nBoleto de salida\nAlgo que aprendí hoy\n${tl(1)}\nUna duda que todavía tengo\n${tl(1)}`);
  return {S,key};
}

let TSTATE={group:"General",lv:null,voice:true};
function tutor(){
  if(!TSTATE.lv) TSTATE.lv=currentLevel();
  const groups=["General",...Object.keys(CAREERS)];
  if(!TSTATE.groupSet&&PROFILE.area&&CAREERS[PROFILE.area]){TSTATE.groupSet=true;}
  const hist=(P.tutor||[]).slice(-3).reverse();
  view.innerHTML=`<div class="stack"><span class="eyebrow">Practica hablando</span><h1>Tutor IA</h1><p class="muted">Conversa en inglés en situaciones reales. El tutor se adapta a tu nivel, te corrige con amabilidad en cada respuesta y al final te da tu retroalimentación.</p></div>
  ${SAMPLE?"":`<p class="notice">El Tutor IA se activa cuando Educa está conectada a su servidor. En modo demo puedes ver los escenarios.</p>`}
  <div class="row" style="gap:12px">
    <label class="field" style="flex:1;min-width:140px"><span class="eyebrow">Nivel de la conversación</span><select id="tlv">${LEVELS.map(l=>`<option value="${l.id}" ${l.id===TSTATE.lv?"selected":""}>${l.id} · ${l.name}</option>`).join("")}</select></label>
    <label class="check" style="align-self:flex-end;padding-bottom:12px"><input type="checkbox" id="tvoice" ${TSTATE.voice?"checked":""}> <span>Respuestas en voz alta</span></label>
  </div>
  <div class="tabs" role="tablist" id="tg">${groups.map(g=>`<button class="tab" role="tab" aria-selected="${g===TSTATE.group}">${g===PROFILE.area?"⭐ ":""}${esc(g)}</button>`).join("")}</div>
  <div class="units" id="tlist"></div>
  ${hist.length?`<section class="card"><span class="eyebrow">Tus últimas conversaciones</span>${hist.map(h=>`<div class="ex-line"><div><b style="font-size:15px">${esc(h.title)}</b><p class="muted" style="font-size:14px">${esc(h.level)} · ${esc(h.date)}</p></div><span class="pill sk">${h.score}/100</span></div>`).join("")}</section>`:""}
  ${(P.tutorPhrases||[]).length?`<section class="card"><span class="eyebrow">Frases que aprendiste con el tutor</span>${(P.tutorPhrases||[]).slice(-8).reverse().map(f=>`<div class="ex-line"><div><b style="font-size:15px">${esc(f.en)}</b><p class="muted" style="font-size:14px">${esc(f.es)}</p></div><button class="speak" data-say="${esc(f.en)}" aria-label="Escuchar">🔊</button></div>`).join("")}</section>`:""}`;
  const draw=()=>{
    const list=SCENARIOS.filter(s=>s.g===TSTATE.group);
    $("#tlist").innerHTML=list.map(s=>{const hard=lvIndex(s.lv)>lvIndex(TSTATE.lv);return `<button class="unit" data-sc="${s.id}" ${SAMPLE?"":"disabled"}><span class="badge">${s.icon}</span><div><h3>${esc(s.title)}</h3><p class="muted">${esc(s.desc)}</p>${hard?`<p class="note">Recomendado desde ${s.lv}. Puedes intentarlo.</p>`:""}</div><span class="pill sk">${s.lv}+</span></button>`;}).join("");
    $("#tlist").querySelectorAll("[data-sc]").forEach(b=>b.onclick=()=>chat(SCENARIOS.find(s=>s.id===b.dataset.sc)));
  };
  $("#tlv").onchange=e=>{TSTATE.lv=e.target.value;draw();};
  $("#tvoice").onchange=e=>{TSTATE.voice=e.target.checked;};
  $("#tg").querySelectorAll(".tab").forEach(b=>b.onclick=()=>{TSTATE.group=b.textContent.replace("⭐ ","");$("#tg").querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",x===b));draw();});
  view.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>say(b.dataset.say));
  draw();
}

function chat(sc){
  const lv=TSTATE.lv; const turns=[]; let busy=false; let ctrl=null;
  const name=PROFILE.name.split(" ")[0];
  const base=`You are role-playing in an English-learning app for young Mexicans called Educa.
Your character: ${sc.ai}.
The learner (${name}) plays: ${sc.me}. Learner's field: ${PROFILE.area}. Learner's goal: ${sc.goal}.
Learner's English level (CEFR): ${lv}. ${LV_GUIDE[lv]}
Rules: stay in character and keep the conversation moving toward the goal. Always end your turn with a question or a prompt for the learner. Never write in Spanish inside "reply". If the learner writes in Spanish, answer in very simple English and encourage them to try in English. Keep everything respectful and appropriate for teenagers and young adults.`;
  setTab("tutor");
  view.innerHTML=`<div class="row" style="justify-content:space-between"><button class="btn ghost" id="tback">← Escenarios</button><span class="pill sk">${lv} · ${esc(sc.title)}</span></div>
  <section class="card" style="gap:6px"><span class="eyebrow">Tu misión</span><p>${esc(sc.desc)}</p></section>
  <div id="msgs" class="chat" aria-live="polite"></div>
  <div class="composer">
    <textarea id="tin" rows="2" placeholder="Escribe tu respuesta en inglés…" style="min-height:64px"></textarea>
    <div class="row" style="justify-content:space-between">
      <div class="row">${DICT?`<button class="speak" id="tmic">🎙️ Hablar</button>`:""}<button class="speak" id="thelp">💡 Ayúdame</button></div>
      <div class="row"><button class="btn ghost" id="tend">Terminar</button><button class="btn" id="tsend">Enviar</button></div>
    </div>
    <p class="note" id="tcount"></p>
  </div>`;
  const msgs=$("#msgs"), tin=$("#tin");
  const scrollEnd=()=>{const last=msgs.lastElementChild;if(last)last.scrollIntoView({block:"nearest",behavior:"smooth"});};
  const addAI=(r)=>{
    const d=document.createElement("div");d.className="bubble ai";
    d.innerHTML=`<p>${esc(r.reply)}</p><div class="row" style="gap:6px"><button class="speak" data-a="say">🔊</button><button class="speak" data-a="tr">Traducir</button></div><p class="note tr" hidden>${esc(r.es||"")}</p>`;
    d.querySelector('[data-a="say"]').onclick=()=>say(r.reply);
    d.querySelector('[data-a="tr"]').onclick=()=>{const t=d.querySelector(".tr");t.hidden=!t.hidden;};
    msgs.appendChild(d);scrollEnd();
    if(TSTATE.voice) say(r.reply);
  };
  const addMe=(text)=>{const d=document.createElement("div");d.className="bubble me";d.innerHTML=`<p>${esc(text)}</p>`;msgs.appendChild(d);scrollEnd();return d;};
  const addFix=(el,fix)=>{if(!fix||!fix.better)return;const f=document.createElement("div");f.className="fixnote";f.innerHTML=`✏️ <b>${esc(fix.better)}</b><br><span class="muted">${esc(fix.why||"")}</span>`;el.after(f);};
  const thinking=()=>{const d=document.createElement("div");d.className="bubble ai typing";d.innerHTML=`<span class="dot"></span>`;msgs.appendChild(d);scrollEnd();return d;};
  const transcript=()=>turns.map(t=>(t.role==="ai"?"TUTOR: ":"LEARNER: ")+t.text).join("\n");
  const count=()=>{const n=turns.filter(t=>t.role==="me").length;$("#tcount").textContent=n?`${n} ${n===1?"respuesta":"respuestas"}. Termina cuando quieras para ver tu retroalimentación.`:"Responde al tutor para empezar.";};
  const lock=v=>{busy=v;["#tsend","#thelp","#tend"].forEach(s=>{const b=$(s);if(b)b.disabled=v;});};
  const fail=(err)=>{toast(err&&err.code==="rate_limited"?"Muchos mensajes seguidos. Espera unos segundos.":err&&err.code==="not_granted"?"El tutor necesita tu permiso para usar la IA.":"No pudimos conectar con el tutor. Inténtalo otra vez.");};

  async function open(){
    lock(true);const t=thinking();
    try{
      const r=await SAMPLE.json(`${base}
Start the conversation now with your first line in character (greet and set the scene).
Respond ONLY with JSON: {"reply":"your first line in English","es":"Spanish translation"}`,{modelTier:"default",cache:false});
      t.remove();turns.push({role:"ai",text:r.reply});addAI(r);
    }catch(e){t.remove();fail(e);msgs.innerHTML=`<section class="card"><p>No pudimos iniciar la conversación.</p><button class="btn" id="retry">Reintentar</button></section>`;$("#retry").onclick=()=>{msgs.innerHTML="";open();};}
    lock(false);count();
  }
  async function send(){
    const text=tin.value.trim(); if(!text||busy) return;
    if(DICT&&DICT_TARGET) DICT.stop().catch(()=>{});
    tin.value="";const me=addMe(text);turns.push({role:"me",text});lock(true);const t=thinking();
    try{
      const r=await SAMPLE.json(`${base}
Conversation so far:
${transcript()}

Do two things:
1) Check the learner's LAST message. If it has a clear grammar, vocabulary or naturalness error for their level, give a correction. Ignore missing capital letters and punctuation. If it is fine, use null.
2) Continue the role-play with your next line in character.
Respond ONLY with JSON: {"fix": null or {"better":"corrected natural version of the learner's last message","why":"very short explanation in Spanish"}, "reply":"your next line in English","es":"Spanish translation of reply"}`,{modelTier:"default",cache:false});
      t.remove();addFix(me,r.fix);if(r.fix)turns[turns.length-1].fix=r.fix;turns.push({role:"ai",text:r.reply});addAI(r);
    }catch(e){t.remove();fail(e);tin.value=text;me.remove();turns.pop();}
    lock(false);count();tin.focus();
  }
  async function help(){
    if(busy)return;lock(true);
    const box=document.createElement("div");box.className="tip";box.textContent="Pensando una pista…";msgs.appendChild(box);scrollEnd();
    try{
      const r=await SAMPLE.json(`${base}
Conversation so far:
${transcript()}

The learner is stuck. Give a hint in Spanish about what they could say next, plus one example answer in English at level ${lv}.
Respond ONLY with JSON: {"hint":"pista breve en español","example":"example answer in English"}`,{modelTier:"quick",cache:false});
      box.innerHTML=`💡 ${esc(r.hint)}<br><b>${esc(r.example)}</b> <button class="speak" style="margin-top:6px">Usar como base</button>`;
      box.querySelector("button").onclick=()=>{tin.value=r.example;tin.focus();};
    }catch(e){box.remove();fail(e);}
    lock(false);
  }
  async function finish(){
    if(busy)return;
    const mine=turns.filter(t=>t.role==="me").length;
    if(mine<2){toast("Responde al menos dos veces para recibir retroalimentación.");return;}
    if(DICT) DICT.stop().catch(()=>{}); DICT_TARGET=null;
    lock(true);
    view.innerHTML=`<div class="loading"><div class="dot"></div><p class="muted">Tu tutor está revisando la conversación…</p></div>`;
    try{
      const r=await SAMPLE.json(`You are an encouraging English teacher for young Mexicans. Evaluate this role-play.
Scenario: ${sc.title}. Learner's goal: ${sc.goal}. Learner's level: ${lv}.
Conversation:
${transcript()}

Respond ONLY with JSON:
{"score": 0-100 based on communication, accuracy and goal achievement for a ${lv} learner,
 "goal": true or false (did they achieve the goal),
 "strength": "una fortaleza concreta en español",
 "errors": [{"you":"what the learner said","better":"improved version","why":"explicación breve en español"}] (max 4, the most useful),
 "phrases": [{"en":"useful phrase for this situation","es":"traducción"}] (exactly 4, at level ${lv}),
 "next": "un consejo concreto en español para la próxima conversación"}`,{modelTier:"default",cache:false});
      const score=Math.max(0,Math.min(100,Math.round(+r.score||0)));
      P.tutor=P.tutor||[];P.tutor.push({title:sc.title,level:lv,score,date:today()});P.tutor=P.tutor.slice(-20);
      P.tutorPhrases=P.tutorPhrases||[];(r.phrases||[]).forEach(f=>{if(f&&f.en&&!P.tutorPhrases.some(x=>x.en===f.en))P.tutorPhrases.push({en:f.en,es:f.es||""});});P.tutorPhrases=P.tutorPhrases.slice(-60);
      P.xp+=mine*5+(r.goal?20:0);bumpStreak();await persist("progress",P);paintStats();
      view.innerHTML=`<section class="hero" style="align-items:center;text-align:center"><span class="eyebrow">${esc(sc.title)} · ${lv}</span><h1>${score}/100</h1><p>${r.goal?"🎯 Cumpliste tu misión.":"Todavía no cumpliste la misión. ¡Inténtalo otra vez!"} Ganaste ${mine*5+(r.goal?20:0)} XP.</p></section>
        <section class="card"><span class="eyebrow">Lo que hiciste bien</span><p>💪 ${esc(r.strength||"")}</p></section>
        ${(r.errors||[]).length?`<section class="card"><span class="eyebrow">Para mejorar</span>${r.errors.map(f=>`<div class="fix"><span><s>${esc(f.you)}</s></span><span><ins>${esc(f.better)}</ins></span><span class="muted">${esc(f.why)}</span></div>`).join("")}</section>`:""}
        ${(r.phrases||[]).length?`<section class="card"><span class="eyebrow">Frases nuevas para esta situación</span>${r.phrases.map(f=>`<div class="ex-line"><div><b style="font-size:16px">${esc(f.en)}</b><p class="muted">${esc(f.es)}</p></div><button class="speak" data-say="${esc(f.en)}" aria-label="Escuchar">🔊</button></div>`).join("")}<p class="note">Se guardaron en tu cuenta.</p></section>`:""}
        <div class="tip">🎯 ${esc(r.next||"")}</div>
        <div class="row"><button class="btn" id="again">Repetir conversación</button><button class="btn ghost" id="other">Otro escenario</button></div>`;
      view.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>say(b.dataset.say));
      $("#again").onclick=()=>chat(sc);$("#other").onclick=tutor;
    }catch(e){
      fail(e);
      view.innerHTML=`<section class="card"><h2>No pudimos generar tu retroalimentación</h2><p class="muted">Tu conversación se perdió al salir. Inténtalo en un momento.</p><button class="btn" id="other">Volver a escenarios</button></section>`;
      $("#other").onclick=tutor;
    }
  }
  $("#tsend").onclick=send;
  tin.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}};
  $("#thelp").onclick=help;
  $("#tend").onclick=finish;
  $("#tback").onclick=()=>{if(DICT)DICT.stop().catch(()=>{});DICT_TARGET=null;tutor();};
  if(DICT){
    const mic=$("#tmic");
    DICT_TARGET={partial:t=>{mic.textContent="🔴 "+(t.length>24?"…"+t.slice(-24):t||"Escuchando");},final:t=>{tin.value=(tin.value+" "+t).trim();},
      state:s=>{if(s!=="listening")mic.textContent="🎙️ Hablar";else mic.textContent="🔴 Escuchando… toca para parar";}};
    mic.onclick=()=>{
      if(mic.textContent.startsWith("🔴")){DICT.stop().catch(()=>{});return;}
      DICT.start({language:"en-US"}).catch(err=>{if(err&&err.code==="not_granted")toast("Permiso de micrófono denegado. Puedes escribir.");else if(err&&!["stopped","dismissed"].includes(err.code))toast("No pudimos usar el micrófono.");});
    };
  }
  open();
}

function cuenta(){
  const doneAll=Object.values(P.lessons).filter(x=>x.passed).length;
  const essays=Object.keys(P.essays).length;
  if(!VOICES.length)loadVoices();
  const theme=document.documentElement.getAttribute("data-theme")||"light";
  view.innerHTML=`<div class="stack"><span class="eyebrow">Mi cuenta</span><h1>${esc(PROFILE.name)}</h1><p class="muted">${esc(PROFILE.email)}</p></div>
  <section class="card">
    <div class="row" style="justify-content:space-between"><span>Nivel actual</span><b>${currentLevel()} · ${LEVELS[unlockedLevel()].name}</b></div>
    <div class="row" style="justify-content:space-between"><span>Lecciones completas</span><b>${doneAll} de ${LESSONS.length}</b></div>
    <div class="row" style="justify-content:space-between"><span>Textos escritos</span><b>${essays}</b></div>
    <div class="row" style="justify-content:space-between"><span>Puntos XP</span><b>${P.xp}</b></div>
    <div class="row" style="justify-content:space-between"><span>Racha</span><b>${P.streak} ${P.streak===1?"día":"días"}</b></div>
  </section>
  <section class="card"><span class="eyebrow">Preferencias</span>
    <div class="row" style="justify-content:space-between"><span>Tema</span><div class="seg"><button data-th="light" aria-pressed="${theme==="light"}">☀️ Claro</button><button data-th="dark" aria-pressed="${theme==="dark"}">🌙 Oscuro</button></div></div>
    <div class="row" style="justify-content:space-between"><span>Sonidos</span><div class="seg"><button data-sd="on" aria-pressed="${SFX.on()}">🔔 Sí</button><button data-sd="off" aria-pressed="${!SFX.on()}">🔕 No</button></div></div>
    ${CFG.neuralVoice?`<p class="note">La voz de Educa usa una voz natural generada con IA.</p>`:`<label class="field"><span>Voz en inglés</span><select id="voice"><option value="">Automática (la más natural)</option>${VOICES.map(v=>`<option value="${esc(v.name)}" ${PREF.get("voice","")===v.name?"selected":""}>${esc(v.name)} · ${esc(v.lang)}</option>`).join("")}</select></label>
    <button class="speak" id="vtest" style="align-self:flex-start">🔊 Probar voz</button>`}
  </section>
  <section class="card"><span class="eyebrow">Por habilidad, todo el plan</span>
    <div class="skills">${SKILLS.map(s=>{const ls=LESSONS.filter(l=>l.skill===s.id);const d=ls.filter(l=>lessonDone(l.id)).length;return `<div class="skill"><span>${s.name} <span class="muted">${d}/${ls.length}</span></span><div class="bar"><i style="width:${d/ls.length*100}%"></i></div></div>`;}).join("")}</div></section>
  <section class="card">
    <div class="row" style="justify-content:space-between"><span>Meta</span><b>${esc(PROFILE.goal)}</b></div>
    <div class="row" style="justify-content:space-between"><span>Área</span><b>${esc(PROFILE.area)}</b></div>
    <div class="row" style="justify-content:space-between"><span>Edad</span><b>${esc(PROFILE.age)}</b></div>
    <div class="row" style="justify-content:space-between"><span>Tiempo diario</span><b>${PROFILE.minutes} min</b></div>
  </section>
  <p class="note">${MODE==="firebase"?"Tu cuenta y tu progreso se guardan en la nube y te siguen en cualquier dispositivo.":"Versión de prueba. Tu cuenta se guarda en este navegador, así que entra siempre desde el mismo."}</p>
  <button class="btn block" id="logout">Cerrar sesión</button>
  <div id="danger" class="stack"><button class="btn ghost block" id="reset">Reiniciar mi progreso</button></div>`;
  view.querySelectorAll("[data-th]").forEach(b=>b.onclick=()=>{PREF.set("theme",b.dataset.th);applyTheme(b.dataset.th);cuenta();});
  view.querySelectorAll("[data-sd]").forEach(b=>b.onclick=()=>{PREF.set("sound",b.dataset.sd);if(b.dataset.sd==="on")SFX.correct();cuenta();});
  const vs=$("#voice"); if(vs) vs.onchange=e=>{PREF.set("voice",e.target.value);say("Hi! This is how I sound.");};
  const vt=$("#vtest"); if(vt) vt.onclick=()=>say("Hi! I'm your English tutor. Let's practice together.");
  $("#logout").onclick=logout;
  $("#reset").onclick=()=>{
    $("#danger").innerHTML=`<div class="card"><p><b>¿Borrar todo tu progreso?</b> Perderás lecciones, XP, racha y textos. Tu cuenta se mantiene.</p>
      <div class="row"><button class="btn" id="yes" style="background:var(--bad);color:#fff">Sí, reiniciar</button><button class="btn ghost" id="no">Cancelar</button></div></div>`;
    $("#no").onclick=cuenta;
    $("#yes").onclick=async()=>{P=freshProgress();await persist("progress",P);paintStats();toast("Progreso reiniciado");cuenta();};
  };
}
/* =====================================================================
   NAVEGACIÓN
   ===================================================================== */
const VIEWS={inicio,lecciones,tutor,digo,carrera,oportunidades,imprimibles,cuenta};
function setTab(name){document.querySelectorAll("nav.tabbar button").forEach(b=>b.removeAttribute("aria-current"));const b=document.querySelector(`nav.tabbar [data-go="${name}"]`);if(b)b.setAttribute("aria-current","page");}
function go(name){
  if(!PROFILE) return;
  if(!VIEWS[name]) name="inicio";
  DICT_TARGET=null; if(DICT) DICT.stop().catch(()=>{});
  setTab(name); VIEWS[name](); decorate(name); window.scrollTo(0,0);
  try{if(location.hash!=="#"+name)history.replaceState(null,"","#"+name);}catch(e){}
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-go]");if(b&&!b.closest("#view .unit[disabled]"))go(b.dataset.go);});
window.addEventListener("hashchange",()=>go(location.hash.slice(1)));
boot();
</script>
</body>
